                        c.classList.add("on"); go.disabled = false; };
    cards.push(c); sc.appendChild(c);
  });

  const go = el("button","btn","Hand over the keys"); go.type = "button"; go.disabled = true;
  go.onclick = () => {
    G.gen++;
    /* The café passes whole. The money does not: there are other children, and they take
       their share. Without this a dynasty simply accumulates -- two million by year sixty,
       with nothing left to want. */
    G.cash = Math.round(G.cash * 0.45);
    G.owner = picked || makeHeir();
    G.heirs = null;
    /* the regulars who finished their arc move on; a new generation meets new people */
    REGULARS.forEach(r => { const st = regState(r.k);
      if(st.done){ G.regs[r.k] = {met:false, beat:0, warmth:0, done:false}; } });
    save(); screenCafe();
  };
  sc.appendChild(go);
  v.appendChild(sc);
  show("close");
}

/* ============================== keeping a dynasty ============================== */
/* Three hundred years lives in one browser's localStorage on one device. Clearing site data,
   a new phone, a reinstall -- any of them takes the lot, and there is nothing the player
   could have done about it. A save is written out as text they can keep anywhere, and read
   back from the same. Nothing leaves the device: this is a string on the screen, not an
   upload, which is what lets it exist at all without touching what the privacy page says. */
function saveText(){
  try { return btoa(unescape(encodeURIComponent(JSON.stringify(G)))); }
  catch(e){ return null; }
}
function loadText(t){
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(t.trim()))));
    if(!o || !o.year || !o.owner) return "That does not look like a Café Life save.";
    G = o; rehydrate(); save(); return null;
  } catch(e){ return "That could not be read. Copy the whole line, including the end."; }
}
function screenSave(){
  const v = $("s-goals"); v.textContent = "";
  const sc = el("div","scroll pad"); sc.style.paddingTop = "18px";
  sc.appendChild(el("div","lbl", (G.cafeName || "the café") + " · " + dateLine()));
  sc.appendChild(el("div","big","Keep this café"));
  sc.appendChild(el("div","hint","Your café lives in this browser and nowhere else. Copy the "
    + "text below and keep it somewhere — a note, an email to yourself — and you can bring "
    + "this café back on any device. Nothing is sent anywhere; it is only text."));

  const box = document.createElement("textarea");
  box.className = "tin"; box.id = "save-out"; box.rows = 5; box.readOnly = true;
  box.style.fontFamily = '"DM Mono", monospace'; box.style.fontSize = "11px";
  box.value = saveText() || "This browser will not let the game read its own save.";
  sc.appendChild(box);
  const copy = el("button","btn","Select it all to copy"); copy.type = "button";
  copy.onclick = () => { box.focus(); box.select(); };
  sc.appendChild(copy);

  sc.appendChild(el("div","lbl","Bring a café back"));
  sc.appendChild(el("div","hint","Paste a saved café here. It replaces the one you are "
    + "playing now, so keep that one first if you want it."));
  const inp = document.createElement("textarea");
  inp.className = "tin"; inp.id = "save-in"; inp.rows = 4;
  inp.placeholder = "Paste here";
  inp.style.fontFamily = '"DM Mono", monospace'; inp.style.fontSize = "11px";
  sc.appendChild(inp);
  const msg = el("div","hint",""); sc.appendChild(msg);
  const put = el("button","btn sec","Bring it back"); put.type = "button";
  put.onclick = () => {
    if(!inp.value.trim()){ msg.textContent = "Nothing pasted yet."; return; }
    const err = loadText(inp.value);
    if(err){ msg.textContent = err; return; }
    screenCafe();
  };
  sc.appendChild(put);

  const back = el("button","btn quiet","Back to the café"); back.type = "button";
  back.onclick = screenCafe; sc.appendChild(back);
  v.appendChild(sc); show("goals");
}

/* ============================== the street ============================== */
/* Three hundred years of the same street is the same year three hundred times. Things happen
   to a shopping street on their own: a mall opens, the metro arrives, somebody opens opposite.
   These land every few years, are permanent, and cut both ways -- which is what stops the
   late game being a number going up. */
const STREET = [
  {k:"metro",  t:"The metro reaches the corner",
   d:"A station entrance where the taxi rank was. Everybody who works in the towers walks past you now.",
   f:g => { g.foot *= 1.35; }},
  {k:"mall",   t:"A mall opens on the main road",
   d:"Air conditioning, a food court and parking. The street is quieter on a Friday than it has ever been.",
   f:g => { g.foot *= 0.78; }},
  {k:"rival",  t:"Somebody opens opposite",
   d:"Same idea, newer chairs. Half your walk-ins will try it at least once.",
   f:g => { g.foot *= 0.86; }},
  {k:"pedest", t:"They pedestrianise the street",
   d:"No cars, tables allowed outside, and nobody in a hurry.",
   f:g => { g.foot *= 1.22; g.dwell += 0.12; }},
  {k:"tower",  t:"A tower goes up behind the souq",
   d:"Four hundred flats where the yard used to be, and all of them want breakfast.",
   f:g => { g.foot *= 1.18; }},
  {k:"review", t:"The landlord reviews the lease",
   d:"Nothing personal, he says. The street is worth more than it was.",
   f:g => { g.rentCut = (g.rentCut || 1) * 1.25; }},
  {k:"fame",   t:"A food writer comes in and does not say who she is",
   d:"The piece runs on a Thursday. For a while, people come a long way for this.",
   f:g => { g.rep += 14; g.foot *= 1.12; }},
  {k:"works",  t:"They dig the road up",
   d:"Eighteen months of hoardings and a temporary crossing fifty metres down.",
   f:g => { g.foot *= 0.82; }}
];
function streetEvent(){
  /* roughly one every three years, never twice the same, and never in the first year */
  if(G.year < YEAR0 + 2) return null;
  if(Math.random() > 0.028) return null;
  G.street = G.street || [];
  let left = STREET.filter(e => G.street.indexOf(e.k) < 0);
  /* A hundred and twenty years used the whole list and then the street went quiet for the
     remaining hundred and eighty. Streets do not stop happening: once they have all come
     round, they come round again -- a second mall, another road dug up, a new rival in the
     same doorway -- keeping only the last few out of the running so nothing repeats twice
     in a row. */
  if(!left.length){ G.street = G.street.slice(-3); left = STREET.filter(e => G.street.indexOf(e.k) < 0); }
  if(!left.length) return null;
  const e = pick(left);
  G.street.push(e.k); e.f(G);
  /* These multiply and they are permanent, and now that they recur there are twenty-odd of
     them over three hundred years. Unbounded that is a geometric series -- the same shape as
     the invention chain and the thirty-cup regular, both of which ran away before anyone
     noticed. A street can get much better or much worse than it was; it cannot get eighty
     times busier. */
  G.foot = Math.max(0.4, Math.min(2.8, G.foot));
  G.rentCut = Math.max(0.4, Math.min(2.6, G.rentCut || 1));
  G.dwell = Math.min(0.9, G.dwell);
  return e;
}

/* ============================== the family ============================== */
/* A dynasty of interchangeable owners is one owner with different names, and three hundred
   years of that is a spreadsheet. An heir is a person: each is better at one thing and worse
   at another, and you pick which of them takes the keys. Those traits are read where they
   would actually be felt -- what the cup costs, what people pay, how hard the room works,
   what the bank thinks of you. */
const TRAITS = [
  {k:"grafter",  t:"the grafter",     d:"Up before the delivery and still there at close.",
   e:"Works the floor like two people, and never learned to charge properly."},
  {k:"trader",   t:"the trader",      d:"Knows what a sack is worth before it is opened.",
   e:"Buys better than anyone in the family. Not much of a host."},
  {k:"host",     t:"the host",        d:"Remembers every order and every name that goes with it.",
   e:"The regulars come for them. The books are somebody else's problem."},
  {k:"banker",   t:"the careful one",  d:"Reads the lease before signing and the rate before borrowing.",
   e:"Money behaves around them. The room never changes much either."},
  {k:"cook",     t:"the cook",        d:"Happiest at the bench with something half-finished.",
   e:"Puts things on the board nobody else would have thought of."}
];
const TRAIT_FX = {
  grafter: {hands:1,  cost:1.00, price:0.94, warm:1.0, rate:1.00},
  trader:  {hands:0,  cost:0.88, price:1.00, warm:0.9, rate:1.00},
  host:    {hands:0,  cost:1.00, price:1.04, warm:1.5, rate:1.00},
  banker:  {hands:0,  cost:1.00, price:1.00, warm:1.0, rate:0.80},
  cook:    {hands:0,  cost:1.00, price:1.10, warm:1.0, rate:1.00}
};
const trait = () => TRAIT_FX[(G.owner && G.owner.trait) || "grafter"] || TRAIT_FX.grafter;
const heirNames = ["Amina","Yusuf","Layla","Omar","Mariam","Tarek","Noor","Khalid","Hessa",
                   "Saif","Dana","Rashid","Fatima","Jassim"];
function makeHeir(){
  const t = pick(TRAITS);
  return {nm:pick(heirNames), age:24 + Math.floor(Math.random()*6),
          dies:72 + Math.floor(Math.random()*18), trait:t.k, traitT:t.t};
}

/* ============================== sourcing and the bench ============================== */
/* Two holes this fills. There was nowhere for the café to exist outside its own four walls,
   and there was nothing left to want once the room was full -- the ladder finished around
   2007 and the next three hundred years were flat. Both are the same hole: money with
   nothing to buy.

   A supplier is a standing decision rather than a purchase. A cheaper cup and a better cup
   pull against each other, and the good ones want a fee every month whether you use them or
   not, so the choice keeps costing you something. */
const SUPPLIERS = {
  cc:    {t:"The cash and carry", d:"Whatever is on the pallet that week. No fee, no favours, "
           + "and you pay the shelf price.",
          cost:1.00, qual:0,    fee:0,    join:0},
  whole: {t:"A wholesaler on the industrial road", d:"Bulk crates, a standing order and a van "
           + "on Tuesdays. Cheaper in the cup, and it costs you whether you sell it or not.",
          cost:0.86, qual:0,    fee:420,  join:900},
  roast: {t:"A roaster who knows your name", d:"He cups the batch before it leaves. Dearer "
           + "than the pallet, and people can taste the difference.",
          cost:0.94, qual:0.12, fee:700,  join:2200},
  estate:{t:"Direct from the estate", d:"A named farm, a named lot, shipped to you. The kind "
           + "of supply a café builds a reputation on, at the kind of price that assumes one.",
          cost:0.80, qual:0.26, fee:2600, join:11000}
};
const supplier = () => SUPPLIERS[G.supplier] || SUPPLIERS.cc;
const supplyFee = () => Math.round(supplier().fee * infl() * FIXED);

/* The bench. Inventing used to be one button in the shop: pay, and a dish appeared. It is a
   project now -- you choose what you are working on, it takes months, and it bills you every
   one of them. Each finished piece of work costs more than the last, which is the sink the
   late game never had. */
const labCost = () => Math.round((900 + G.labDone * 1400) * infl() * MONTH_DAYS);
const labMonths = () => 3 + Math.min(5, G.labDone);
const LAB_LINES = [
  {k:"sweet",    t:"Something sweet",      d:"For the afternoon, and for people who came in with children."},
  {k:"warm",     t:"Something warm",       d:"The winter board, and the early mornings."},
  {k:"cold",     t:"Something cold",       d:"Summer is forty degrees and the street does not stop for it."},
  {k:"savoury",  t:"Something savoury",    d:"People who come in at noon and want lunch, not cake."},
  {k:"quick",    t:"Something quick",      d:"For the ones who will not sit down."}
];

function screenSupply(){
  const v = $("s-supply"); v.textContent = "";
  const sc = el("div","scroll pad"); sc.style.paddingTop = "18px";
  sc.appendChild(el("div","lbl", dateLine()));
  sc.appendChild(el("div","big","Sourcing"));
  sc.appendChild(el("div","hint","What goes in the cup, and who you get it from. A fee is "
    + "charged every month the arrangement stands."));

  Object.keys(SUPPLIERS).forEach(k => {
    const sp = SUPPLIERS[k], here = G.supplier === k;
    const join = Math.round(sp.join * infl() * MONTH_DAYS / 10);
    const c = el("div","pickr" + (here ? " on" : ""));
    c.appendChild(el("div","t", sp.t));
    c.appendChild(el("div","d", sp.d));
    c.appendChild(el("div","m",
      (sp.cost < 1 ? Math.round((1-sp.cost)*100) + "% cheaper in the cup" : "shelf price")
      + (sp.qual ? " · " + Math.round(sp.qual*100) + "% better" : "")
      + (sp.fee ? " · " + money(Math.round(sp.fee*infl()*FIXED)) + " a month" : " · no fee")
      + (here ? " · YOURS" : join ? " · " + money(join) + " to start" : "")));
    if(!here) c.onclick = () => {
      if(G.cash < join) return;
      G.cash -= join; G.supplier = k; save(); screenSupply();
    };
    sc.appendChild(c);
  });

  sc.appendChild(el("div","lbl","The bench"));
  if(G.lab){
    const left = G.lab.months;
    const c = el("div","card");
    c.appendChild(el("div","t", G.lab.t));
    c.appendChild(el("div","hint", left + (left === 1 ? " month to go." : " months to go.")
      + " It bills " + money(Math.round(labCost()/labMonths())) + " each month until it is done."));
    sc.appendChild(c);
    const stop = el("button","btn quiet","Abandon the work"); stop.type = "button";
    stop.onclick = () => { G.lab = null; save(); screenSupply(); };
    sc.appendChild(stop);
  } else {
    sc.appendChild(el("div","hint","A new recipe of your own, worked out over "
      + labMonths() + " months at " + money(labCost()) + " in total. The "
      + (G.labDone ? "next one will cost more again." : "first is the cheapest you will ever do.")));
    LAB_LINES.forEach(l => {
      const c = el("div","pickr");
      c.appendChild(el("div","t", l.t));
      c.appendChild(el("div","d", l.d));
      c.onclick = () => {
        if(G.cash < Math.round(labCost()/labMonths())) return;
        G.lab = {line:l.k, t:l.t, months:labMonths(), each:Math.round(labCost()/labMonths())};
        save(); screenSupply();
      };
      sc.appendChild(c);
    });
  }
  const back = el("button","btn sec","Back to the café"); back.type = "button";
  back.onclick = screenCafe; sc.appendChild(back);
  v.appendChild(sc); show("supply");
}

/* a finished piece of bench work, built on the invention machinery but aimed by the player */
function labFinish(){
  const line = G.lab.line;
  const pool = INVENTABLE.filter(i => i.tags.indexOf(line) >= 0);
  const inv = pool.length ? pick(pool) : pick(INVENTABLE);
  const invented = {}; G.cookbook.forEach(c => { if(c.invented) invented[c.k] = 1; });
  const stock = G.recipes.filter(k => !invented[k]);
  const src = RECIPES[pick(stock.length ? stock : G.recipes)];
  const k = "lab" + G.labDone + "_" + G.gen;
  RECIPES[k] = {nm: pick(INV_A) + " " + inv.n, ic: src.ic,
                cost: Math.round(src.cost * 1.05),
                price: Math.round(src.price * 1.55), tags: inv.tags.slice(), buy:0};
  SPRITE[k] = inv.sp;
  G.recipes.push(k);
  G.cookbook.push({k:k, nm:RECIPES[k].nm, by:G.owner.nm, year:G.year, gen:G.gen,
                   invented:true, price:RECIPES[k].price, cost:RECIPES[k].cost,
                   tags:RECIPES[k].tags, ic:RECIPES[k].ic, sp:SPRITE[k]});
  G.labDone++; G.lab = null;
  return RECIPES[k].nm;
}

/* ============================== the bank ============================== */
/* Until now there was no way to lose. Money only ever went up, spending was a shopping list,
   and a decision you cannot get wrong is not a decision. Borrowing puts a floor under
   expansion and a rope around your neck: the payment is due whether the month was good or
   not, and a café that cannot pay goes into arrears, then loses what it built.

   What you can borrow is what the café can service, not what you would like. */
const borrowLimit = () => Math.max(0, Math.round(
  (G.lastTake * 4 + G.seats * 220 * MONTH_DAYS + (own("freehold") ? 9000*MONTH_DAYS : 0))
  - G.debt));
const RATE_BASE = 0.011;
/* a café with a record borrows cheaper than one without */
const offerRate = () => Math.max(0.005, (RATE_BASE - Math.min(0.004, G.rep * 0.00012)
                                 + (G.arrears ? 0.004 : 0)) * trait().rate);
const monthlyDue = () => G.debt > 0
  ? Math.round(G.debt * G.debtRate) + Math.round(G.debt * 0.02) : 0;

function screenBank(){
  const v = $("s-bank"); v.textContent = "";
  const sc = el("div","scroll pad"); sc.style.paddingTop = "18px";
  sc.appendChild(el("div","lbl", dateLine()));
  sc.appendChild(el("div","big", G.debt > 0 ? "You owe the bank" : "The bank"));

  const c = el("div","card");
  const st = (k,val,cls) => { const r = el("div","stat"); r.appendChild(el("div","k",k));
    r.appendChild(el("div","v " + (cls||""), val)); c.appendChild(r); };
  st("In the till", money(G.cash) + " AED", "cash");
  if(G.debt > 0){
    st("Owed", money(G.debt) + " AED", "bad");
    st("Interest", (G.debtRate*100).toFixed(1) + "% a month", "bad");
    st("Due each month", money(monthlyDue()) + " AED", "bad");
  }
  if(G.arrears) st("Months in arrears", String(G.arrears), "bad");
  st("They would lend you", money(borrowLimit()) + " AED");
  st("At", (offerRate()*100).toFixed(1) + "% a month");
  sc.appendChild(c);

  if(G.arrears)
    sc.appendChild(el("div","hint","You have missed a payment. Miss three and they take the "
      + "café back — a branch first if you have one, then the freehold, then the keys."));
  else
    sc.appendChild(el("div","hint","A loan is paid back whether the month was good or not. "
      + "Borrow against what the café already earns, not against what you hope it will."));

  [0.25, 0.5, 1].forEach(frac => {
    const amt = Math.round(borrowLimit() * frac / (100*MONTH_DAYS)) * 100 * MONTH_DAYS;
    if(amt < 100*MONTH_DAYS) return;
    const b = el("button","btn" + (frac === 1 ? " sec" : ""), "Borrow " + money(amt) + " AED");
    b.type = "button";
    b.onclick = () => {
      /* one rate for the whole balance: a blended rate is a spreadsheet, not a decision */
      G.debtRate = offerRate();
      G.debt += amt; G.cash += amt; save(); screenBank();
    };
    sc.appendChild(b);
  });
  if(G.debt > 0 && G.cash > 0){
    const pay = Math.min(G.cash, G.debt);
    const b = el("button","btn sec","Pay off " + money(pay) + " AED now"); b.type = "button";
    b.onclick = () => { G.cash -= pay; G.debt -= pay;
                        if(G.debt <= 0){ G.debt = 0; G.debtRate = 0; G.arrears = 0; }
                        save(); screenBank(); };
    sc.appendChild(b);
  }
  const back = el("button","btn quiet","Back to the café"); back.type = "button";
  back.onclick = screenCafe; sc.appendChild(back);
  v.appendChild(sc); show("bank");
}

/* ============================== ambitions ============================== */
/* A first play reported nothing to achieve, and it was right: the game had one "Next" card
   and no notion of having arrived anywhere. These are the things a café owner would actually
   be pleased about, checked when the books close. They pay out, because a goal that only
   ticks a box is a list; and they are ordered so there is always a near one and a far one. */
const GOALS = [
  {k:"board4",  t:"Four things on the board",  d:"Room to put a morning and an afternoon on it at once.",
   at:g => g.slots >= 4,                                  pay:g => goalPay(0.6)},
  {k:"seats10", t:"Ten seats",                 d:"Enough that people stay rather than take it away.",
   at:g => g.seats >= 10,                                 pay:g => goalPay(0.8)},
  {k:"met3",    t:"Three regulars",            d:"Three people you know by name and by order.",
   at:g => REGULARS.filter(r => regState(r.k).met).length >= 3, pay:g => goalPay(0.6)},
  {k:"hire",    t:"A second pair of hands",    d:"Somebody else behind the counter.",
   at:g => g.staff.length >= 1,                           pay:g => goalPay(0.9)},
  {k:"debtfree",t:"Nothing owed to anybody",   d:"The loan cleared, the café yours outright.",
   at:g => g.tenure === "loan" && g.debt === 0,           pay:g => goalPay(1.6)},
  {k:"invent",  t:"A recipe of your own",      d:"Something in the cookbook under your name.",
   at:g => g.cookbook.some(c => c.invented),              pay:g => goalPay(1.0)},
  {k:"board8",  t:"A board you cannot fill",   d:"Every slot the wall will take.",
   at:g => g.slots >= 8,                                  pay:g => goalPay(1.5)},
  {k:"story2",  t:"Two stories seen through",  d:"Two people whose lives you followed to the end.",
   at:g => REGULARS.filter(r => regState(r.k).done).length >= 2, pay:g => goalPay(1.6)},
  {k:"branch",  t:"A second door",             d:"A café somewhere else with your name on it.",
   at:g => g.branches.length >= 1,                        pay:g => goalPay(1.8)},
  {k:"month50", t:"Fifty thousand in a month", d:"One month's takings past fifty thousand.",
   at:g => g.best.take >= 50000,                          pay:g => goalPay(1.8)},
  {k:"freehold",t:"Your own four walls",       d:"The freehold bought; no landlord at all.",
   at:g => own("freehold") > 0,                           pay:g => goalPay(2.2)},
  {k:"gen2",    t:"The keys handed on",        d:"A second generation behind the counter.",
   at:g => g.gen >= 2,                                    pay:g => goalPay(2.5)},
  {k:"gen4",    t:"A name on the street",      d:"Four generations of the same family in the same room.",
   at:g => g.gen >= 4,                                    pay:g => goalPay(3.5)},
  {k:"estate",  t:"Straight from the estate",  d:"A named farm and a named lot, shipped to your door.",
   at:g => g.supplier === "estate",                       pay:g => goalPay(2.0)},
  {k:"lab3",    t:"Three of your own",          d:"Three recipes worked out at the bench, not bought.",
   at:g => g.labDone >= 3,                                pay:g => goalPay(2.2)},
  {k:"century", t:"A hundred years",           d:"The café open a century after you took the keys.",
   at:g => g.year >= YEAR0 + 100,                         pay:g => goalPay(5.0)}
];
/* An ambition paid a flat sum fixed at design time, and the first few were worth 10,000 to
   15,000 against a month's takings of 1,695 -- eight months of revenue for reaching ten
   seats, which flattens the early climb it is supposed to reward. Worse, the same sum is
   loose change by 2100, so the far end stopped meaning anything at all.

   Paid as a multiple of what the café actually takes in a month instead, with a floor so the
   first ones are not trivial. The same number stays meaningful across three centuries. */
const goalPay = x => Math.round(Math.max(90 * MONTH_DAYS, (G.lastTake || 0) * x));

function checkGoals(){
  const won = [];
  GOALS.forEach(go => {
    if(G.goals[go.k]) return;
    if(!go.at(G)) return;
    G.goals[go.k] = G.year;
    const pay = go.pay(G); G.cash += pay; G.rep += 2;
    won.push({g:go, pay:pay});
  });
  return won;
}
function screenGoals(){
  const v = $("s-goals"); v.textContent = "";
  const sc = el("div","scroll pad"); sc.style.paddingTop = "18px";
  const done = GOALS.filter(g => G.goals[g.k]).length;
  sc.appendChild(el("div","lbl", done + " of " + GOALS.length + " · " + (G.cafeName || "the café")));
  sc.appendChild(el("div","big","Ambitions"));
  GOALS.forEach(go => {
    const got = G.goals[go.k];
    const c = el("div","card"); if(got) c.style.borderColor = "var(--amber-d)";
    const row = el("div","stat");
    row.appendChild(el("div","k", go.t));
    row.appendChild(el("div","v " + (got ? "good" : ""), got ? String(got) : "+" + money(go.pay(G))));
    c.appendChild(row);
    c.appendChild(el("div","hint", go.d));
    sc.appendChild(c);
  });
  const b = el("button","btn sec","Back to the café"); b.type = "button";
  b.onclick = screenCafe; sc.appendChild(b);
  v.appendChild(sc); show("goals");
}

/* ============================== setting up ============================== */
/* The game used to begin with a café that was simply there, unnamed, owned by nobody in
   particular. Three questions instead -- what it is called, who you are, and how you came by
   the place -- and the third is a mechanical choice, not flavour: it sets the money you open
   with, the rent, the state of the room, and whether you owe anybody anything. The loan start
   is the debt system's first customer. */
const TENURES = [
  {k:"father", t:"Your father's shop",
   d:"He kept it thirty years and it shows: the floor is worn and the machine is older than "
    + "you. But the rent has not moved since 1979, and the people who came for him are still "
    + "coming.",
   m:"Less money · cheap rent · a worn room · one regular already knows you",
   f:g => { g.cash = Math.round(380*MONTH_DAYS); g.rentCut = 0.55; g.wear = 22;
            g.headStart = true; }},
  {k:"bought", t:"Bought with everything you had",
   d:"No landlord's favour and no debt. An empty room, a clean lease and nothing in the bank "
    + "to fall back on.",
   m:"A middling start · full rent · nothing owed",
   f:g => { g.cash = Math.round(640*MONTH_DAYS); }},
  {k:"loan", t:"On the bank's money",
   d:"More to open with than either of the others, and a repayment every month whether the "
    + "café takes anything or not. The room is fitted out properly from the first day.",
   m:"Most money · full rent · a debt to service",
   f:g => { g.cash = Math.round(1500*MONTH_DAYS); g.debt = Math.round(1200*MONTH_DAYS);
            g.debtRate = 0.011; }}
];

function screenSetup(){
  let name = "", who = "", pickK = null;
  const v = $("s-cafe"); v.textContent = "";
  const sc = el("div","scroll pad"); sc.style.paddingTop = "26px";
  sc.appendChild(el("div","lbl","A shopping street, 1996"));
  sc.appendChild(el("div","big","Open a café"));
  sc.appendChild(el("div","hint","A unit on the corner, a machine, and whatever you can put on "
    + "the board. What happens after that is yours."));

  sc.appendChild(el("div","lbl","What is it called"));
  const n1 = document.createElement("input");
  n1.className = "tin"; n1.type = "text"; n1.maxLength = 28; n1.id = "setup-name";
  n1.placeholder = pick(["The Corner","Karak House","Al Manara","Sadiq & Sons","The Blue Door"]);
  sc.appendChild(n1);

  sc.appendChild(el("div","lbl","And who are you"));
  const n2 = document.createElement("input");
  n2.className = "tin"; n2.type = "text"; n2.maxLength = 22; n2.id = "setup-owner";
  n2.placeholder = pick(["Amina","Yusuf","Layla","Omar","Mariam","Tarek"]);
  sc.appendChild(n2);

  sc.appendChild(el("div","lbl","How you came by the place"));
  const cards = [];
  TENURES.forEach(t => {
    const c = el("div","pickr");
    c.appendChild(el("div","t", t.t));
    c.appendChild(el("div","d", t.d));
    c.appendChild(el("div","m", t.m));
    c.onclick = () => { pickK = t.k; cards.forEach(x => x.classList.remove("on")); c.classList.add("on"); go.disabled = false; };
    cards.push(c); sc.appendChild(c);
  });

  const go = el("button","btn","Take the keys"); go.type = "button"; go.disabled = true;
  go.onclick = () => {
    const t = TENURES.find(x => x.k === pickK); if(!t) return;
    G.cafeName = (n1.value || n1.placeholder).trim().slice(0,28);
    G.owner.nm = (n2.value || n2.placeholder).trim().slice(0,22);
    G.tenure = t.k; t.f(G);
    const mine = pick(TRAITS); G.owner.trait = mine.k; G.owner.traitT = mine.t;
    /* somebody came for your father and still comes for you */
    if(G.headStart){ const r = REGULARS[0]; G.regs[r.k] = {met:true, beat:0, warmth:18, done:false}; }
    G.setup = true; save(); intro();
  };
  sc.appendChild(go);
  v.appendChild(sc); show("cafe");
}

/* ============================== boot ============================== */
function intro(){
  const v = $("s-cafe"); v.textContent = "";
  const bar = el("div","bar"); bar.appendChild(el("div","pill","Spring 1996"));
  v.appendChild(bar);
  drawRoom(v, false);
  const sc = el("div","scroll pad"); sc.style.paddingTop = "16px";
  sc.appendChild(el("div","lbl", G.cafeName || "Café Life"));
  sc.appendChild(el("div","big","A counter and two stools"));
  [ "You have one machine, two recipes and " + money(G.cash) + " dirhams. There is no "
    + "clock and nothing here can be failed.",
    "Each season you choose what goes on the board — you will always own more recipes than "
    + "you have room to show, and the season moves what people want. Then you open, and you "
    + "watch who comes in.",
    "Some of them will come back. Tap someone while they are here and you go over and say "
    + "something; it is worth almost nothing on the till, and it is the only way anyone's "
    + "story moves."
  ].forEach(t => sc.appendChild(el("div","hint", t)));
  const go = el("button","btn","Open the shutters"); go.type = "button";
  go.onclick = () => { G.seenIntro = true; save(); screenCafe(); };
  sc.appendChild(go);
  v.appendChild(sc); show("cafe");
}
const prior = load();
if(prior){ G = prior; rehydrate(); }
!G.setup ? screenSetup() : (G.seenIntro ? screenCafe() : intro());
</script></body></html>
