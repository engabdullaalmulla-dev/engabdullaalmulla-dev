<title>Marble Nations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Marble Nations / Glassball -- prototype styling.
   Portrait-first. The whole app lives inside a phone-shaped frame so the
   prototype reads as the product it is meant to become, not as a web page. */

:root{
  --bg:#070b0f; --frame:#0d141a; --surface:#141d25; --surface2:#1b262f;
  --line:#25343f; --line2:#32444f;
  --text:#eaf1f5; --muted:#93a7b4; --dim:#61737f;
  --pitch:#0f3b2e; --accent:#3fe08c; --accent2:#5bb8ff;
  --gold:#f3c451; --danger:#ff6b6b; --warn:#ffb648;
  --radius:14px; --radius-sm:9px;
  /* Broadcast pairing: a condensed grotesque for the scoreboard furniture,
     a humanist sans for everything you actually read. */
  --ui:"IBM Plex Sans","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:"Saira Condensed","Oswald","Arial Narrow",-apple-system,system-ui,sans-serif;
  --shadow:0 10px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:
    radial-gradient(1200px 700px at 50% -10%, #16303f 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  font:400 15px/1.45 var(--ui);
  -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center; align-items:center; padding:16px;
}
.app{
  width:min(430px,100%); height:min(932px,calc(100dvh - 32px));
  background:var(--frame); border:1px solid var(--line);
  border-radius:28px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; overflow:hidden; position:relative;
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:460px){
  body{padding:0}
  .app{border-radius:0;border:none;height:100dvh;width:100%}
}

/* ---------- chrome ---------- */
.topbar{
  display:flex; align-items:center; gap:10px; padding:14px 16px 10px;
  border-bottom:1px solid var(--line); background:linear-gradient(180deg,#16212a,#111a21);
  flex:0 0 auto;
}
.topbar h1{font:700 19px/1.1 var(--display);letter-spacing:.03em;margin:0;letter-spacing:.2px;font-weight:650;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:11.5px;color:var(--muted);font-weight:450}
.iconbtn{
  background:var(--surface2); border:1px solid var(--line2); color:var(--text);
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;
  font-size:15px; flex:0 0 auto;
}
.iconbtn:hover{background:#243340}
.screen{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch}
.pad{padding:16px 16px 28px}

.tabbar{
  display:flex; border-top:1px solid var(--line); background:#101920; flex:0 0 auto;
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1; background:none; border:none; color:var(--dim); padding:10px 4px 12px;
  font:600 11.5px/1.3 var(--display); letter-spacing:.13em; cursor:pointer; display:grid; gap:3px; justify-items:center;
}
.tabbar button .g{font-size:17px;line-height:1}
.tabbar button[aria-current="true"]{color:var(--accent)}

/* ---------- generic ---------- */
h2{font:700 25px/1.1 var(--display);margin:0 0 4px;letter-spacing:.01em;text-wrap:balance}
h3{font:600 14px/1.2 var(--display);margin:20px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.11em}
p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer;transition:border-color .15s,transform .1s}
.card.tap:hover{border-color:var(--line2)}
.card.tap:active{transform:scale(.995)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.spread{flex:1;min-width:0}
.btn{
  display:block;width:100%;padding:14px;border-radius:12px;border:1px solid transparent;
  background:var(--accent);color:#04240f;font:700 15px/1 inherit;cursor:pointer;letter-spacing:.1px;
}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--text)}
.btn.ghost:hover{background:var(--surface2)}
.btn.gold{background:var(--gold);color:#2a1f00}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;display:inline-block}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  background:var(--surface2);border:1px solid var(--line2);color:var(--muted);
  font:600 12px/1.5 var(--display);letter-spacing:.06em;
}
.pill.ok{color:var(--accent);border-color:#1d5e3f;background:#0f2b1f}
.pill.warn{color:var(--warn);border-color:#5d4620;background:#2b2114}
.pill.bad{color:var(--danger);border-color:#5d2626;background:#2b1414}
.pill.gold{color:var(--gold);border-color:#5c4a19;background:#2b2414}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.tiny{font-size:11.5px}
.mono{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);margin:14px 0}

/* ---------- marbles ---------- */
.mb{width:26px;height:26px;border-radius:50%;flex:0 0 auto;position:relative;
  box-shadow:inset 0 -3px 5px rgba(0,0,0,.32), inset 0 3px 5px rgba(255,255,255,.3), 0 1px 3px rgba(0,0,0,.5);
  overflow:hidden}
.mb i{position:absolute;inset:0;display:block}
.mb::after{content:"";position:absolute;left:22%;top:14%;width:26%;height:20%;border-radius:50%;
  background:rgba(255,255,255,.55);filter:blur(1.2px)}
.mb.lg{width:38px;height:38px}
.mb.sm{width:19px;height:19px}
.teamline{display:flex;align-items:center;gap:9px;min-width:0}
.teamline .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.teamline .cd{font:700 11px/1 inherit;color:var(--dim);letter-spacing:.08em}
.fav{outline:2px solid var(--accent);outline-offset:2px}
.favtag{font:700 9px/1 inherit;color:#04240f;background:var(--accent);padding:2px 4px;border-radius:4px;letter-spacing:.06em}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 12px/1 var(--display);color:var(--dim);text-transform:uppercase;letter-spacing:.09em;
  text-align:right;padding:0 0 7px}
th:first-child,td:first-child{text-align:left}
td{padding:6px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
tr.qual td{background:linear-gradient(90deg,rgba(63,224,140,.11),transparent 65%)}
tr.third td{background:linear-gradient(90deg,rgba(91,184,255,.10),transparent 65%)}
tr.me td{font-weight:650}
.pos{width:18px;color:var(--dim);font-weight:700}

/* ---------- fixtures ---------- */
.fx{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--radius-sm);background:var(--surface);margin-bottom:7px}
.fx .side{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.fx .side.r{justify-content:flex-end}
.fx .side .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .sc{font:800 19px/1 var(--display);min-width:46px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.fx.next{border-color:var(--accent);box-shadow:0 0 0 1px rgba(63,224,140,.22)}
.fx.mine{border-left:3px solid var(--accent)}

/* ---------- arena ---------- */
.arena-wrap{position:relative;background:#05090c;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#arena{flex:1 1 auto;width:100%;min-height:0;display:block;touch-action:none}
.scoreboard{
  display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(180deg,#16212a,#111a21);
  border-bottom:1px solid var(--line); flex:0 0 auto;
}
.scoreboard .t{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.scoreboard .t.r{justify-content:flex-end}
.scoreboard .t .nm{font:700 19px/1 var(--display);letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scoreboard .score{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.03em;
  padding:3px 10px;border-radius:8px;background:#0a1117;border:1px solid var(--line2)}
.clockline{display:flex;justify-content:center;gap:8px;padding:6px 0 2px;font:600 13px/1 var(--display);letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted)}
.ticker{
  flex:0 0 auto;height:64px;overflow-y:auto;padding:8px 12px;background:#0a1117;border-top:1px solid var(--line);
  font-size:12px;
}
.ticker div{display:flex;gap:8px;padding:2px 0;color:var(--muted)}
.ticker div b{color:var(--text);font-weight:650}
.ticker .t{color:var(--dim);min-width:34px;font-variant-numeric:tabular-nums}
.ticker .goal b{color:var(--accent)}
.controls{display:flex;gap:7px;padding:10px 12px;background:#101920;border-top:1px solid var(--line);flex:0 0 auto}
.controls button{
  flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);
  color:var(--text);font:650 12px/1 inherit;cursor:pointer
}
.controls button[aria-pressed="true"]{background:var(--accent);color:#04240f;border-color:transparent}

.bigflash{
  position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  font:800 clamp(46px,16vw,76px)/1 var(--display);letter-spacing:.04em;
  text-shadow:0 6px 30px rgba(0,0,0,.8);opacity:0;
}
.bigflash.on{animation:pop 1.5s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.06)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.02)}}

/* ---------- draw ceremony ---------- */
.pots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.pot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;min-height:120px}
.pot h4{margin:0 0 7px;font:650 10px/1 inherit;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.pot .m{display:flex;justify-content:center;margin-bottom:4px;opacity:.95}
.pot .m.used{opacity:.16}
.groupgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.gcell{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px}
.gcell h5{margin:0 0 6px;font:700 11px/1 inherit;color:var(--muted);letter-spacing:.06em}
.gcell .slot{display:flex;align-items:center;gap:5px;height:21px;margin-bottom:3px}
.gcell .slot .cd{font:700 9.5px/1 inherit;letter-spacing:.05em;color:var(--muted)}
.gcell .slot.empty{opacity:.2}
.gcell.hit{border-color:var(--accent);box-shadow:0 0 0 1px rgba(63,224,140,.3)}
.drawline{min-height:34px;font-size:12.5px;color:var(--muted);padding:8px 2px;text-align:center}

/* ---------- bracket ---------- */
.bracket{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.bcol{flex:0 0 168px;display:flex;flex-direction:column;gap:6px}
.bcol h5{margin:0 0 2px;font:650 10px/1 inherit;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.btie{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12px}
.btie .r{display:flex;align-items:center;gap:6px;padding:2px 0}
.btie .r .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btie .r.w{font-weight:700}
.btie .r.l{opacity:.45}
.btie.mine{border-color:var(--accent)}

/* ---------- nation picker ---------- */
.search{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line2);
  background:var(--surface);color:var(--text);font:400 14px/1 inherit;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}
.ncell{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 6px;
  display:grid;gap:5px;justify-items:center;cursor:pointer;text-align:center}
.ncell.on{border-color:var(--accent);background:#0f2419}
.ncell .nm{font-size:10.5px;font-weight:600;line-height:1.2;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ncell .cf{font-size:9px;color:var(--dim);letter-spacing:.06em;font-weight:600}

/* ---------- misc ---------- */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;padding:9px 6px;border-radius:8px;border:none;background:none;color:var(--muted);
  font:650 12.5px/1 inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#04240f}
.note{background:#122029;border-left:3px solid var(--accent2);padding:10px 12px;border-radius:0 8px 8px 0;
  font-size:12.5px;color:#b9d2e0;margin-bottom:10px}
.note.warn{border-left-color:var(--warn);background:#231c11;color:#e6cfa8}
.consequence{font-size:14px;font-weight:600;padding:11px 13px;border-radius:11px;background:#0f2419;
  border:1px solid #1d5e3f;margin-bottom:8px;color:#c8f2dc}
.consequence.bad{background:#2a1414;border-color:#5d2626;color:#f5cfcf}
.consequence.neutral{background:var(--surface2);border-color:var(--line2);color:var(--text)}
.trophy{display:grid;justify-items:center;gap:10px;padding:26px 12px;text-align:center}
.trophy .cup{font-size:64px;filter:drop-shadow(0 8px 24px rgba(243,196,81,.35))}
.sheet{position:absolute;inset:0;background:rgba(4,8,11,.72);display:flex;align-items:flex-end;z-index:20}
.sheet .inner{background:var(--frame);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;
  width:100%;max-height:84%;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.kv:first-of-type{border-top:none}
.kv b{font-weight:650}
a{color:var(--accent2)}

</style>
<div class="app" id="app"></div>
<script type="module" src="src/app.js"></script>
