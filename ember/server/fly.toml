# Deploy from the ember/ directory:
#
#   fly launch --no-deploy --copy-config --config server/fly.toml
#   fly volumes create ember_data --size 1
#   fly deploy --config server/fly.toml --dockerfile server/Dockerfile
#
# Rooms live in this process's memory, so run exactly one machine. Scaling out
# would split players across machines that cannot see each other's tables.

app = "ember-server"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATABASE_PATH = "/data/ember.db"
  TRUST_PROXY = "1"

[mounts]
  source = "ember_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_start_machines = true
  # Suspending a machine mid-game would drop every open table, so this one
  # stays up rather than scaling to zero.
  auto_stop_machines = "off"
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 400
    soft_limit = 300

  [[http_service.http_checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
