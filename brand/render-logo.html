<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  *{box-sizing:border-box} body{margin:0;background:#fff;font-family:"DM Sans",sans-serif}
  .stage{display:inline-block;padding:0}
  .wm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.045em;
      line-height:.86;white-space:nowrap}
  .wm .r{display:block}
  /* the lockup is the icon at cap height beside the mark, on one optical baseline */
  .lock{display:flex;align-items:center;gap:26px}
  .lock img{width:132px;height:132px;border-radius:29px;display:block}
  .tag{font-family:"DM Mono",monospace;font-size:13px;letter-spacing:.34em;text-transform:uppercase}
</style></head><body>
<div id="wm-dark" class="stage" style="background:#171310;padding:44px 52px">
  <div class="wm" style="color:#F7EFE3;font-size:104px">Caf<span style="color:#F2A03D">é</span> Rush</div>
</div>
<div id="wm-light" class="stage" style="background:#F7EFE3;padding:44px 52px">
  <div class="wm" style="color:#171310;font-size:104px">Caf<span style="color:#C97C22">é</span> Rush</div>
</div>
<div id="wm-stack" class="stage" style="background:#171310;padding:46px 54px">
  <div class="wm" style="color:#F7EFE3;font-size:96px"><span class="r">Caf<span style="color:#F2A03D">é</span></span><span class="r">Rush</span></div>
</div>
<div id="lockup-dark" class="stage" style="background:#171310;padding:40px 48px">
  <div class="lock">
    <img src="assets/icon/ios/icon-1024.png" alt="">
    <div><div class="wm" style="color:#F7EFE3;font-size:80px">Caf<span style="color:#F2A03D">é</span> Rush</div></div>
  </div>
</div>
<div id="lockup-light" class="stage" style="background:#F7EFE3;padding:40px 48px">
  <div class="lock">
    <img src="assets/icon/ios/icon-1024.png" alt="">
    <div><div class="wm" style="color:#171310;font-size:80px">Caf<span style="color:#C97C22">é</span> Rush</div></div>
  </div>
</div>
<div id="wm-mono-dark" class="stage" style="background:#171310;padding:44px 52px">
  <div class="wm" style="color:#F7EFE3;font-size:104px">Café Rush</div>
</div>
<div id="wm-mono-light" class="stage" style="background:#F7EFE3;padding:44px 52px">
  <div class="wm" style="color:#171310;font-size:104px">Café Rush</div>
</div>
</body></html>
