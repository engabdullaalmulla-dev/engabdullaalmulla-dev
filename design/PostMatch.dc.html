<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0B6E3F; } a:hover { color: #07512E; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .disp { font-family: 'Bricolage Grotesque', 'Arial Black', sans-serif; font-weight: 800; letter-spacing: -.03em; }
    .pop { cursor: pointer; transition: transform .28s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, background .25s ease, border-color .25s ease; }
    .pop:active { transform: scale(.94); }
    @keyframes fall { 0% { opacity: 0; transform: translateY(-40px) rotate(0deg); } 12% { opacity: 1; } 100% { opacity: 0; transform: translateY(250px) rotate(560deg); } }
    @keyframes scorePop { 0% { opacity: 0; transform: scale(.4); } 60% { transform: scale(1.14); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes bounceIn { 0% { opacity: 0; transform: translateY(18px) scale(.95); } 60% { transform: translateY(-3px) scale(1.012); } 100% { opacity: 1; transform: none; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FFFCF2; font-family: 'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif; color: #10201A; display: flex; flex-direction: column; overflow: hidden;">

  <!-- celebration band -->
  <div style="position: relative; background-color: #0F9E58; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.055) 0 30px, transparent 30px 60px); color: #FFFFFF; padding: 24px 20px 26px; border-radius: 0 0 28px 28px; overflow: hidden; box-shadow: 0 8px 0 #0A7A43;">

    <sc-for list="{{confetti}}" as="c" hint-placeholder-count="18">
      <div style="position: absolute; top: -16px; left: {{c.left}}; width: {{c.size}}; height: {{c.tall}}; background: {{c.color}}; border-radius: 2px; animation: fall {{c.dur}} linear both; animation-delay: {{c.delay}};"></div>
    </sc-for>

    <div style="position: relative; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <div style="background: #FFCE2E; color: #10201A; border-radius: 999px; padding: 6px 12px; font-size: 11.5px; font-weight: 800;">FULL TIME</div>
        <div style="font-size: 12px; font-weight: 700; color: #BDEFD4;">Thursday · Al Quoz</div>
      </div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 14px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; flex-grow: 1;">
          <div style="width: 30px; height: 30px; border-radius: 999px; background: #FFCE2E; border: 2.5px solid #FFFFFF;"></div>
          <div style="font-size: 11px; font-weight: 800;">YELLOWS</div>
        </div>
        <div class="disp" style="font-size: 74px; line-height: .84; white-space: nowrap; animation: scorePop .7s cubic-bezier(.34,1.56,.64,1) .1s both;">6–5</div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px; flex-grow: 1;">
          <div style="width: 30px; height: 30px; border-radius: 999px; background: #FFFFFF; border: 2.5px solid rgba(255,255,255,.55);"></div>
          <div style="font-size: 11px; font-weight: 800; color: #BDEFD4;">WHITES</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(0,0,0,.16); border-radius: 16px; padding: 12px 14px;">
        <div class="disp" style="font-size: 22px;">You won — and you bagged 2</div>
      </div>
    </div>
  </div>

  <div style="padding: 16px 20px 0; flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px;">

    <!-- MOTM -->
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
        <div class="disp" style="font-size: 28px;">Man of the match?</div>
        <div style="font-size: 12.5px; font-weight: 800; color: #FF5A3C; white-space: nowrap;">{{votedLabel}}</div>
      </div>
      <div style="font-size: 13px; font-weight: 600; color: #6B7D74; line-height: 1.45; margin-top: -6px;">One tap. It decides the levels — and the bragging rights.</div>

      <div style="display: flex; gap: 10px;">
        <sc-for list="{{mates}}" as="m" hint-placeholder-count="3">
          <div class="pop" onClick="{{ m.vote }}" style="flex-grow: 1; background: {{m.bg}}; border: 2.5px solid {{m.border}}; border-radius: 20px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 4px 0 {{m.shadow}};">
            <div style="width: 50px; height: 50px; border-radius: 999px; background: {{m.faceBg}}; color: {{m.faceFg}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800;">{{m.initials}}</div>
            <div style="font-size: 13px; font-weight: 800; color: {{m.nameColor}};">{{m.name}}</div>
            <div style="font-size: 10.5px; font-weight: 700; color: {{m.metaColor}}; text-align: center; line-height: 1.3;">{{m.meta}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- clips -->
    <div style="border-radius: 22px; background: #10201A; color: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 13px; animation: bounceIn .55s cubic-bezier(.34,1.56,.64,1) .2s both;">
      <div class="pop" onClick="{{ togglePlay }}" style="display: flex; align-items: center; gap: 13px;">
        <div style="width: 50px; height: 50px; border-radius: 999px; background: #FF5A3C; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 0 #C43A20;">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="{{playIcon}}" fill="#FFFFFF"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
          <div class="disp" style="font-size: 21px;">Your goals are up</div>
          <div style="font-size: 12.5px; font-weight: 600; color: #9FBCAE;">{{clipCaption}}</div>
        </div>
        <div style="background: #FFCE2E; color: #10201A; border-radius: 999px; padding: 6px 10px; font-size: 11px; font-weight: 800; white-space: nowrap;">Share</div>
      </div>
      <div style="display: flex; gap: 7px;">
        <sc-for list="{{clips}}" as="c" hint-placeholder-count="3">
          <div class="pop" onClick="{{ c.pick }}" style="flex-grow: 1; height: 56px; border-radius: 14px; background: {{c.bg}}; border: 2.5px solid {{c.ring}}; display: flex; align-items: flex-end; padding: 7px;">
            <span style="font-size: 11px; font-weight: 800; color: #FFFFFF;">{{c.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- level progress -->
    <div style="border-radius: 22px; background: #FFFFFF; border: 2px solid #F0EADA; padding: 18px; display: flex; flex-direction: column; gap: 13px; margin-bottom: 22px; animation: slideUp .5s cubic-bezier(.22,1,.36,1) .3s both;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div class="disp" style="font-size: 20px;">Level 4 → 5</div>
        <div style="background: #FFF6D6; color: #8A6A00; border-radius: 999px; padding: 6px 11px; font-size: 11.5px; font-weight: 800; white-space: nowrap;">2 wins away</div>
      </div>
      <div style="height: 12px; border-radius: 999px; background: #F0EADA; overflow: hidden;">
        <div style="width: 72%; height: 12px; border-radius: 999px; background: linear-gradient(90deg, #0F9E58, #FFCE2E);"></div>
      </div>
    </div>

  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { motm: null, clip: 0, playing: false };
  }

  renderVals() {
    const mateDefs = [
      { id: 'rk', initials: 'RK', name: 'Rami', meta: '1 goal, 2 assists' },
      { id: 'ma', initials: 'MA', name: 'Marco', meta: 'Two big saves' },
      { id: 'jt', initials: 'JT', name: 'Jonas', meta: 'Debut, never stopped' },
    ];

    const picked = this.state.motm;

    const mates = mateDefs.map((m) => {
      const on = picked === m.id;
      return {
        initials: m.initials,
        name: m.name,
        meta: m.meta,
        bg: on ? '#0F9E58' : '#FFFFFF',
        border: on ? '#0F9E58' : '#F0EADA',
        shadow: on ? '#0A7A43' : '#EDE6D3',
        faceBg: on ? '#FFCE2E' : '#F0EADA',
        faceFg: '#10201A',
        nameColor: on ? '#FFFFFF' : '#10201A',
        metaColor: on ? '#BDEFD4' : '#6B7D74',
        vote: () => this.setState({ motm: on ? null : m.id }),
      };
    });

    const clipDefs = [
      { label: "0'12 ⚽", caption: 'Near post, first time.', bg: '#1A3A2A' },
      { label: "1'04 🧤", caption: 'Marco tipped it over.', bg: '#24402F' },
      { label: "2'31 ⚽", caption: 'Your second of the night.', bg: '#163024' },
    ];
    const sel = this.state.clip;
    const playing = this.state.playing;
    const clips = clipDefs.map((c, i) => ({
      label: c.label,
      bg: c.bg,
      ring: i === sel ? '#FFCE2E' : 'transparent',
      pick: () => this.setState({ clip: i, playing: false }),
    }));

    const colors = ['#FFCE2E', '#FF5A3C', '#FFFFFF', '#3DA5FF', '#BDEFD4'];
    const confetti = [];
    for (let i = 0; i < 18; i++) {
      confetti.push({
        left: (4 + ((i * 37) % 92)) + '%',
        size: (5 + (i % 3) * 2) + 'px',
        tall: (9 + (i % 4) * 3) + 'px',
        color: colors[i % colors.length],
        dur: (1.9 + (i % 5) * 0.35) + 's',
        delay: ((i % 7) * 0.18) + 's',
      });
    }

    let votedLabel = 'Pick one';
    if (picked) { votedLabel = 'Vote counted'; }

    return {
      mates: mates,
      clips: clips,
      confetti: confetti,
      votedLabel: votedLabel,
      playIcon: playing ? 'M8 5h3v14H8zM13 5h3v14h-3z' : 'M8 5.5v13l11-6.5z',
      clipCaption: playing ? 'Playing — ' + clipDefs[sel].label : clipDefs[sel].caption,
      togglePlay: () => this.setState({ playing: !playing }),
    };
  }
}
</script>
</body>
</html>
