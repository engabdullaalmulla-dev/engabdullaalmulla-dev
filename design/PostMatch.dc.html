<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,800;1,600;1,800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E5342A; } a:hover { color: #B8241C; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .impact { font-family: Kanit, 'Arial Narrow', Impact, sans-serif; font-weight: 800; font-style: italic; letter-spacing: -.02em; }
    .sub { font-family: Kanit, 'Arial Narrow', sans-serif; font-weight: 600; font-style: italic; letter-spacing: .04em; text-transform: uppercase; }
    .halftone { background-image: radial-gradient(rgba(20,20,27,.24) 1.3px, transparent 1.4px); background-size: 6px 6px; }
    .ink { border: 3px solid #14141B; }
    .drop { box-shadow: 5px 5px 0 #14141B; }
    .drop-sm { box-shadow: 3px 3px 0 #14141B; }
    .tap { cursor: pointer; transition: transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s ease, background .2s ease; }
    .tap:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #14141B; }
    @keyframes burstIn { 0% { opacity: 0; transform: scale(.2) rotate(-40deg); } 70% { opacity: 1; transform: scale(1.06) rotate(4deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
    @keyframes slam { 0% { opacity: 0; transform: translateY(-24px) scale(1.5); } 62% { transform: translateY(3px) scale(.96); } 100% { opacity: 1; transform: none; } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F2E7; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Helvetica Neue', Arial, sans-serif; color: #14141B; display: flex; flex-direction: column; overflow: hidden;">

  <!-- impact panel -->
  <div style="position: relative; overflow: hidden; background: #2050E0; border-bottom: 4px solid #14141B; padding: 20px 18px 22px;">
    <div style="position: absolute; left: 50%; top: 42%; width: 620px; height: 620px; margin: -310px 0 0 -310px; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.20) 0deg 5deg, transparent 5deg 11deg);"></div>
    <div class="halftone" style="position: absolute; inset: 0; opacity: .35;"></div>

    <div style="position: relative; display: flex; flex-direction: column; gap: 14px;">

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <div class="ink sub drop-sm" style="background: #FFC42E; border-width: 2.5px; padding: 5px 11px; font-size: 10.5px; transform: rotate(-2deg);">Full time</div>
        <div class="sub" style="font-size: 10px; color: #FFFFFF;">Thursday · Al Quoz</div>
      </div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; flex-grow: 1;">
          <div class="ink" style="width: 28px; height: 28px; border-radius: 999px; border-width: 2.5px; background: #E5342A;"></div>
          <div class="sub" style="font-size: 9.5px; color: #FFFFFF;">Reds</div>
        </div>
        <div class="impact" style="font-size: 86px; line-height: .8; white-space: nowrap; color: #FFFFFF; text-shadow: 5px 5px 0 #14141B; animation: slam .55s cubic-bezier(.34,1.56,.64,1) .08s both;">6-5</div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; flex-grow: 1;">
          <div class="ink" style="width: 28px; height: 28px; border-radius: 999px; border-width: 2.5px; background: #FFFFFF;"></div>
          <div class="sub" style="font-size: 9.5px; color: #FFFFFF;">Whites</div>
        </div>
      </div>

      <div class="ink drop-sm" style="background: #FFFFFF; padding: 11px 13px; transform: rotate(-1deg); display: flex; align-items: center; justify-content: center; animation: burstIn .55s cubic-bezier(.34,1.56,.64,1) .3s both;">
        <div class="impact" style="font-size: 21px; text-align: center;">YOU WON — AND BAGGED 2!</div>
      </div>

    </div>
  </div>

  <div style="padding: 16px 18px 0; flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;">

    <!-- MOTM -->
    <div style="display: flex; flex-direction: column; gap: 11px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <div class="impact" style="font-size: 26px;">MAN OF THE MATCH</div>
        <div class="ink sub" style="border-width: 2.5px; background: {{votedBg}}; color: {{votedFg}}; padding: 4px 9px; font-size: 9.5px; white-space: nowrap;">{{votedLabel}}</div>
      </div>
      <div style="font-size: 12px; font-weight: 500; color: #5A5A66; line-height: 1.45; margin-top: -6px;">One tap. It decides the levels — and the bragging rights.</div>

      <div style="display: flex; gap: 9px;">
        <sc-for list="{{mates}}" as="m" hint-placeholder-count="3">
          <div class="tap ink drop-sm" onClick="{{ m.vote }}" style="flex-grow: 1; background: {{m.bg}}; padding: 13px 7px; display: flex; flex-direction: column; align-items: center; gap: 7px;">
            <div class="ink" style="width: 48px; height: 48px; border-radius: 999px; border-width: 2.5px; background: {{m.faceBg}}; color: {{m.faceFg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900;">{{m.initials}}</div>
            <div class="impact" style="font-size: 15px; color: {{m.nameColor}};">{{m.name}}</div>
            <div style="font-size: 10px; font-weight: 500; color: {{m.metaColor}}; text-align: center; line-height: 1.3;">{{m.meta}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- clips -->
    <div class="ink drop-sm" style="background: #14141B; color: #F6F2E7; padding: 14px; display: flex; flex-direction: column; gap: 12px; animation: slideIn .45s cubic-bezier(.22,1,.36,1) .2s both;">
      <div class="tap" onClick="{{ togglePlay }}" style="display: flex; align-items: center; gap: 12px;">
        <div class="ink" style="width: 48px; height: 48px; border-radius: 999px; border-width: 2.5px; border-color: #F6F2E7; background: #E5342A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="{{playIcon}}" fill="#FFFFFF"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
          <div class="impact" style="font-size: 19px;">YOUR GOALS ARE UP</div>
          <div style="font-size: 11.5px; font-weight: 500; color: #A0A0AD;">{{clipCaption}}</div>
        </div>
        <div class="ink sub" style="border-width: 2px; border-color: #FFC42E; color: #FFC42E; padding: 5px 9px; font-size: 9px; white-space: nowrap;">Share</div>
      </div>
      <div style="display: flex; gap: 7px;">
        <sc-for list="{{clips}}" as="c" hint-placeholder-count="3">
          <div class="tap ink" onClick="{{ c.pick }}" style="flex-grow: 1; height: 54px; border-width: 2.5px; border-color: {{c.ring}}; background: {{c.bg}}; display: flex; align-items: flex-end; padding: 7px;">
            <span class="sub" style="font-size: 9px; color: {{c.labelColor}};">{{c.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- level -->
    <div class="ink drop-sm" style="background: #FFFFFF; padding: 15px; display: flex; flex-direction: column; gap: 11px; margin-bottom: 20px; animation: slideIn .45s cubic-bezier(.22,1,.36,1) .28s both;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <div class="impact" style="font-size: 19px;">LEVEL 4 → 5</div>
        <div class="ink sub" style="border-width: 2.5px; background: #FFC42E; padding: 4px 9px; font-size: 9.5px; white-space: nowrap;">2 wins away</div>
      </div>
      <div class="ink" style="height: 16px; border-width: 2.5px; background: #EFE9DA; overflow: hidden;">
        <div style="width: 72%; height: 100%; background: #E5342A; border-right: 2.5px solid #14141B;"></div>
      </div>
    </div>

  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { motm: null, clip: 0, playing: false };
  }

  renderVals() {
    const mateDefs = [
      { id: 'rk', initials: 'RK', name: 'RAMI', meta: '1 goal, 2 assists' },
      { id: 'ma', initials: 'MA', name: 'MARCO', meta: 'Two big saves' },
      { id: 'jt', initials: 'JT', name: 'JONAS', meta: 'Debut, never stopped' },
    ];
    const picked = this.state.motm;

    const mates = mateDefs.map((m) => {
      const on = picked === m.id;
      return {
        initials: m.initials,
        name: m.name,
        meta: m.meta,
        bg: on ? '#FFC42E' : '#FFFFFF',
        faceBg: on ? '#E5342A' : '#EFE9DA',
        faceFg: on ? '#FFFFFF' : '#14141B',
        nameColor: '#14141B',
        metaColor: on ? '#6B5610' : '#5A5A66',
        vote: () => this.setState({ motm: on ? null : m.id }),
      };
    });

    const clipDefs = [
      { label: "0'12 goal", caption: 'Near post, first time.' },
      { label: "1'04 save", caption: 'Marco tipped it over.' },
      { label: "2'31 goal", caption: 'Your second of the night.' },
    ];
    const sel = this.state.clip;
    const playing = this.state.playing;
    const clips = clipDefs.map((c, i) => {
      const on = i === sel;
      return {
        label: c.label,
        bg: on ? '#2050E0' : '#24242E',
        ring: on ? '#FFC42E' : '#3A3A46',
        labelColor: on ? '#FFFFFF' : '#8C8C99',
        pick: () => this.setState({ clip: i, playing: false }),
      };
    });

    return {
      mates: mates,
      clips: clips,
      votedLabel: picked ? 'Vote in' : 'Pick one',
      votedBg: picked ? '#1F9E55' : '#E5342A',
      votedFg: '#FFFFFF',
      playIcon: playing ? 'M8 5h3v14H8zM13 5h3v14h-3z' : 'M8 5.5v13l11-6.5z',
      clipCaption: playing ? 'Playing — ' + clipDefs[sel].label : clipDefs[sel].caption,
      togglePlay: () => this.setState({ playing: !playing }),
    };
  }
}
</script>
</body>
</html>
