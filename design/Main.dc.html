<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Sora:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C6FF4A; } a:hover { color: #D9FF80; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .disp { font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-variation-settings: 'wdth' 122, 'wght' 800; letter-spacing: -.02em; }
    .lbl { font-family: Archivo, sans-serif; font-variation-settings: 'wdth' 108, 'wght' 700; letter-spacing: .16em; text-transform: uppercase; }
    .panel { background: #0E1C17; border: 1px solid #22392F; box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 18px 44px -24px rgba(0,0,0,.9); }
    .tap { cursor: pointer; transition: transform .4s cubic-bezier(.22,1,.36,1), background .3s ease, border-color .3s ease, box-shadow .3s ease; }
    .tap:active { transform: scale(.982); }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes swell { from { opacity: 0; transform: translateY(18px) scale(.986); } to { opacity: 1; transform: none; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 65% { transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #07110E; font-family: Sora, 'Helvetica Neue', Arial, sans-serif; color: #EAF5EE; display: flex; flex-direction: column; overflow: hidden;">

  <!-- header -->
  <div style="padding: 30px 20px 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div class="lbl" style="font-size: 10px; color: #C6FF4A;">Thursday · Al Quoz</div>
      <div class="disp" style="font-size: 42px; line-height: .94;">TONIGHT</div>
    </div>
    <div class="tap" style="width: 44px; height: 44px; border-radius: 999px; background: #152820; border: 1px solid #2C4739; color: #EAF5EE; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;">AA</div>
  </div>

  <!-- hero -->
  <div style="padding: 0 20px;">
    <div style="position: relative; border-radius: 24px; overflow: hidden; border: 1px solid #2A4B39; box-shadow: 0 26px 56px -26px rgba(0,0,0,.95), 0 0 40px -18px rgba(198,255,74,.28); animation: swell .7s cubic-bezier(.22,1,.36,1) both;">

      <div style="position: absolute; inset: 0; background-color: #0C3826; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 26px, transparent 26px 52px);"></div>
      <div style="position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% -18%, rgba(226,255,178,.34) 0%, rgba(198,255,74,.10) 34%, transparent 66%);"></div>

      <div style="position: relative; padding: 20px; display: flex; flex-direction: column; gap: 18px;">

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 8px; background: rgba(255,61,127,.16); border: 1px solid rgba(255,61,127,.45); border-radius: 999px; padding: 6px 11px;">
            <div style="width: 6px; height: 6px; border-radius: 999px; background: #FF3D7F; animation: blink 1.5s ease-in-out infinite;"></div>
            <span class="lbl" style="font-size: 9.5px; color: #FF8FB4;">{{hero.countdown}}</span>
          </div>
          <div class="lbl" style="font-size: 9.5px; color: #9FCF7A; border: 1px solid #3D6B3A; border-radius: 999px; padding: 6px 11px;">{{hero.tier}}</div>
        </div>

        <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
            <div class="disp" style="font-size: 62px; line-height: .84; color: #FFFFFF;">{{hero.time}}</div>
            <div style="font-size: 15px; font-weight: 700; letter-spacing: -.01em;">{{hero.venue}}</div>
            <div style="font-size: 12.5px; font-weight: 500; color: #8DA79A;">{{hero.meta}}</div>
          </div>
          <div class="disp" style="font-size: 22px; line-height: 1; color: #C6FF4A; flex-shrink: 0;">{{hero.price}}</div>
        </div>

        <div style="display: flex; align-items: center; gap: 11px;">
          <div style="display: flex;">
            <sc-for list="{{hero.faces}}" as="f" hint-placeholder-count="5">
              <div style="width: 31px; height: 31px; border-radius: 999px; background: {{f.bg}}; color: {{f.fg}}; border: 2px solid #0C3826; margin-left: {{f.shift}}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; animation: pop .5s cubic-bezier(.22,1,.36,1) both; animation-delay: {{f.delay}};">{{f.label}}</div>
            </sc-for>
          </div>
          <div style="font-size: 12.5px; font-weight: 600; line-height: 1.35; color: #C3D6CB;">{{hero.crew}}</div>
        </div>

        <div class="tap" onClick="{{ book }}" style="min-height: 56px; border-radius: 16px; background: {{ctaBg}}; color: {{ctaFg}}; border: 1px solid {{ctaBorder}}; box-shadow: {{ctaGlow}}; display: flex; align-items: center; justify-content: center;">
          <span class="disp" style="font-size: 16px; letter-spacing: .01em;">{{ctaLabel}}</span>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; justify-content: center;">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#9FCF7A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
          <div style="font-size: 12px; font-weight: 500; color: #9FCF7A;">Can't make it? Money straight back.</div>
        </div>

      </div>
    </div>
  </div>

  <!-- also -->
  <div style="padding: 22px 20px 10px; display: flex; align-items: center; gap: 12px;">
    <div class="lbl" style="font-size: 10px; color: #6F8A7C;">Also on tonight</div>
    <div style="height: 1px; background: #1C3129; flex-grow: 1;"></div>
  </div>

  <div style="padding: 0 20px 12px; flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 9px;">
    <sc-for list="{{others}}" as="g" hint-placeholder-count="2">
      <div class="tap panel" onClick="{{ g.pick }}" style="border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 14px; animation: rise .5s cubic-bezier(.22,1,.36,1) both; animation-delay: {{g.delay}};">
        <div class="disp" style="font-size: 21px; line-height: 1; color: {{g.timeColor}}; min-width: 66px;">{{g.time}}</div>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 14px; font-weight: 700; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{g.venue}}</div>
          <div style="font-size: 12px; font-weight: 600; color: {{g.statusColor}};">{{g.status}}</div>
        </div>
        <div style="font-size: 13px; font-weight: 700; color: #8DA79A; flex-shrink: 0;">{{g.price}}</div>
      </div>
    </sc-for>
  </div>

  <!-- nav -->
  <div style="display: flex; padding: 8px 12px 20px; gap: 2px; border-top: 1px solid #1C3129;">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <div class="tap" onClick="{{ n.pick }}" style="flex-grow: 1; min-height: 54px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; background: {{n.bg}};">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="{{n.color}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
        <div class="lbl" style="font-size: 8.5px; color: {{n.color}};">{{n.label}}</div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hero: 0, booked: false };
  }

  renderVals() {
    const defs = [
      { time: '19:00', venue: 'Al Quoz Sports Park', meta: '7-a-side · astro · floodlit', tier: 'Your level', price: 'AED 45', taken: 13, total: 14, countdown: 'Kick-off 5h 42m', crew: 'Three of your crew are playing' },
      { time: '20:30', venue: 'The Sevens', meta: '5-a-side · indoor', tier: 'A level up', price: 'AED 38', taken: 10, total: 10, countdown: 'Kick-off 7h 12m', crew: 'Rami and Marco are in' },
      { time: '21:00', venue: 'Insportz Indoor', meta: '7-a-side · indoor', tier: 'Your level', price: 'AED 50', taken: 8, total: 14, countdown: 'Kick-off 7h 42m', crew: 'Plenty of room — bring someone' },
    ];

    const say = (d) => {
      const left = d.total - d.taken;
      if (left <= 0) { return 'Full — waitlist open'; }
      if (left === 1) { return 'One shirt left'; }
      return left + ' shirts left';
    };

    const palette = [
      { bg: '#C6FF4A', fg: '#07110E' },
      { bg: '#FFB23D', fg: '#07110E' },
      { bg: '#FF3D7F', fg: '#FFFFFF' },
      { bg: '#2F4C3E', fg: '#EAF5EE' },
      { bg: '#EAF5EE', fg: '#07110E' },
    ];
    const names = ['RK', 'MA', 'DS', 'JT', 'SH'];

    const i = this.state.hero;
    const h = defs[i];
    const full = h.total - h.taken <= 0;
    const booked = this.state.booked;

    const faces = names.map((n, k) => ({
      label: n,
      bg: palette[k].bg,
      fg: palette[k].fg,
      shift: k === 0 ? '0' : '-10px',
      delay: (0.3 + k * 0.06) + 's',
    }));

    let ctaLabel = 'TAKE A SHIRT · ' + h.price;
    if (booked) { ctaLabel = "YOU'RE IN"; }
    else if (full) { ctaLabel = 'JOIN THE WAITLIST'; }

    const others = [];
    defs.forEach((d, k) => {
      if (k === i) { return; }
      const isFull = d.total - d.taken <= 0;
      others.push({
        time: d.time,
        venue: d.venue,
        price: d.price,
        status: say(d),
        timeColor: isFull ? '#6F8A7C' : '#EAF5EE',
        statusColor: isFull ? '#6F8A7C' : '#C6FF4A',
        delay: (others.length * 0.08 + 0.3) + 's',
        pick: () => this.setState({ hero: k, booked: false }),
      });
    });

    const navDefs = [
      { id: 'play', label: 'Play', icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 8l4 3-1.5 4.5h-5L8 11z' },
      { id: 'season', label: 'Season', icon: 'M4 20V9M10 20V4M16 20v-7M22 20H2' },
      { id: 'crew', label: 'Crew', icon: 'M16 20v-2a4 4 0 0 0-8 0v2M12 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.3' },
      { id: 'you', label: 'You', icon: 'M5 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8' },
    ];
    const nav = navDefs.map((n) => {
      const on = n.id === 'play';
      return {
        label: n.label,
        icon: n.icon,
        color: on ? '#C6FF4A' : '#5E7568',
        bg: on ? '#132219' : 'transparent',
        pick: () => {},
      };
    });

    return {
      hero: { time: h.time, venue: h.venue, meta: h.meta, tier: h.tier, price: h.price, countdown: h.countdown, crew: h.crew, faces: faces },
      others: others,
      nav: nav,
      ctaLabel: ctaLabel,
      ctaBg: booked ? 'rgba(198,255,74,.10)' : '#C6FF4A',
      ctaFg: booked ? '#C6FF4A' : '#07110E',
      ctaBorder: booked ? '#4E7A32' : 'transparent',
      ctaGlow: booked ? 'none' : '0 0 34px -6px rgba(198,255,74,.55)',
      book: () => this.setState({ booked: !booked }),
    };
  }
}
</script>
</body>
</html>
