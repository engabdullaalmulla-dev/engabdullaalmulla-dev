<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,800;1,600;1,800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E5342A; } a:hover { color: #B8241C; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .impact { font-family: Kanit, 'Arial Narrow', Impact, sans-serif; font-weight: 800; font-style: italic; letter-spacing: -.02em; }
    .sub { font-family: Kanit, 'Arial Narrow', sans-serif; font-weight: 600; font-style: italic; letter-spacing: .04em; text-transform: uppercase; }
    .halftone { background-image: radial-gradient(rgba(20,20,27,.26) 1.3px, transparent 1.4px); background-size: 6px 6px; }
    .halftone-lt { background-image: radial-gradient(rgba(255,255,255,.30) 1.2px, transparent 1.3px); background-size: 5px 5px; }
    .speed { background-image: repeating-conic-gradient(from 0deg at 50% 26%, rgba(20,20,27,.12) 0deg 1deg, transparent 1deg 3.2deg); }
    .ink { border: 3px solid #14141B; }
    .drop { box-shadow: 5px 5px 0 #14141B; }
    .drop-sm { box-shadow: 3px 3px 0 #14141B; }
    .tap { cursor: pointer; transition: transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s ease, background .2s ease; }
    .tap:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #14141B; }
    @keyframes zoomIn { 0% { opacity: 0; transform: scale(.86) rotate(-1.6deg); } 65% { transform: scale(1.02) rotate(.4deg); } 100% { opacity: 1; transform: scale(1) rotate(-.5deg); } }
    @keyframes slam { 0% { opacity: 0; transform: translateY(-14px) scale(1.2); } 60% { transform: translateY(2px) scale(.98); } 100% { opacity: 1; transform: none; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
    @keyframes flash { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F2E7; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Helvetica Neue', Arial, sans-serif; color: #14141B; display: flex; flex-direction: column; overflow: hidden;">

  <!-- masthead -->
  <div style="padding: 22px 18px 14px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <div class="sub" style="font-size: 11px; color: #E5342A;">Thursday · Al Quoz</div>
      <div class="impact" style="font-size: 46px; line-height: .9; text-shadow: 3px 3px 0 #14141B; color: #F6F2E7; -webkit-text-stroke: 2.5px #14141B;">TONIGHT</div>
    </div>
    <div class="tap ink drop-sm" style="width: 46px; height: 46px; border-radius: 999px; background: #FFC42E; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; flex-shrink: 0;">AA</div>
  </div>

  <!-- hero panel -->
  <div style="padding: 0 18px;">
    <div class="ink drop" style="position: relative; overflow: hidden; background: #7FC4F5; animation: zoomIn .55s cubic-bezier(.34,1.56,.64,1) both;">
      <div class="speed" style="position: absolute; inset: 0;"></div>
      <div class="halftone" style="position: absolute; left: 0; right: 0; top: 0; height: 46%; opacity: .5;"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 42%; background: #1F9E55; border-top: 3px solid #14141B;"></div>
      <div class="halftone-lt" style="position: absolute; left: 0; right: 0; bottom: 0; height: 42%; opacity: .5;"></div>

      <div style="position: relative; padding: 16px; display: flex; flex-direction: column; gap: 12px;">

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <div class="ink sub" style="display: flex; align-items: center; gap: 7px; background: #E5342A; color: #FFFFFF; border-width: 2.5px; padding: 5px 10px; font-size: 10.5px;">
            <span style="width: 7px; height: 7px; border-radius: 999px; background: #FFC42E; animation: flash 1.2s ease-in-out infinite;"></span>
            {{hero.countdown}}
          </div>
          <div class="ink sub" style="background: #F6F2E7; border-width: 2.5px; padding: 5px 10px; font-size: 10.5px;">{{hero.tier}}</div>
        </div>

        <div class="impact" style="font-size: 74px; line-height: .82; color: #FFFFFF; text-shadow: 4px 4px 0 #14141B; animation: slam .5s cubic-bezier(.34,1.56,.64,1) .1s both;">{{hero.time}}</div>

        <div class="ink" style="background: #F6F2E7; border-width: 2.5px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
            <div style="font-size: 15px; font-weight: 900; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{hero.venue}}</div>
            <div style="font-size: 11.5px; font-weight: 500; color: #5A5A66;">{{hero.meta}}</div>
          </div>
          <div class="impact" style="font-size: 20px; color: #E5342A; flex-shrink: 0;">{{hero.price}}</div>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="display: flex;">
            <sc-for list="{{hero.faces}}" as="f" hint-placeholder-count="5">
              <div class="ink" style="width: 32px; height: 32px; border-radius: 999px; border-width: 2.5px; background: {{f.bg}}; color: {{f.fg}}; margin-left: {{f.shift}}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; animation: slam .4s cubic-bezier(.34,1.56,.64,1) both; animation-delay: {{f.delay}};">{{f.label}}</div>
            </sc-for>
          </div>
          <div style="font-size: 12px; font-weight: 700; color: #FFFFFF; text-shadow: 1.5px 1.5px 0 #14141B; line-height: 1.3;">{{hero.crew}}</div>
        </div>

        <div class="tap ink drop-sm" onClick="{{ book }}" style="min-height: 56px; background: {{ctaBg}}; color: {{ctaFg}}; display: flex; align-items: center; justify-content: center;">
          <span class="impact" style="font-size: 20px;">{{ctaLabel}}</span>
        </div>

        <div style="display: flex; align-items: center; gap: 7px; justify-content: center;">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#14141B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
          <div style="font-size: 11.5px; font-weight: 700; color: #14141B;">Can't make it? Money straight back.</div>
        </div>

      </div>
    </div>
  </div>

  <!-- also -->
  <div style="padding: 18px 18px 8px; display: flex; align-items: center; gap: 10px;">
    <div class="sub" style="font-size: 11px;">Also on tonight</div>
    <div style="height: 3px; background: #14141B; flex-grow: 1;"></div>
  </div>

  <div style="padding: 0 18px 12px; flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 9px;">
    <sc-for list="{{others}}" as="g" hint-placeholder-count="2">
      <div class="tap ink drop-sm" onClick="{{ g.pick }}" style="background: #FFFFFF; padding: 11px 12px; display: flex; align-items: center; gap: 12px; animation: slideIn .4s cubic-bezier(.22,1,.36,1) both; animation-delay: {{g.delay}};">
        <div class="impact ink" style="font-size: 20px; border-width: 2.5px; background: {{g.chipBg}}; color: {{g.chipFg}}; padding: 7px 9px; min-width: 72px; text-align: center;">{{g.time}}</div>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 14px; font-weight: 900; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{g.venue}}</div>
          <div class="sub" style="font-size: 10px; color: {{g.statusColor}};">{{g.status}}</div>
        </div>
        <div class="impact" style="font-size: 15px; color: #5A5A66; flex-shrink: 0;">{{g.price}}</div>
      </div>
    </sc-for>
  </div>

  <!-- nav -->
  <div style="display: flex; padding: 8px 12px 18px; gap: 4px; border-top: 3px solid #14141B; background: #EFE9DA;">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <div class="tap" onClick="{{ n.pick }}" style="flex-grow: 1; min-height: 52px; border: {{n.border}}; background: {{n.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="{{n.color}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
        <div class="sub" style="font-size: 9px; color: {{n.color}};">{{n.label}}</div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hero: 0, booked: false };
  }

  renderVals() {
    const defs = [
      { time: '19:00', venue: 'Al Quoz Sports Park', meta: '7-a-side · astro · floodlit', tier: 'Your level', price: 'AED 45', taken: 13, total: 14, countdown: 'Kick-off 5h 42m', crew: 'Three of your crew are in' },
      { time: '20:30', venue: 'The Sevens', meta: '5-a-side · indoor', tier: 'A level up', price: 'AED 38', taken: 10, total: 10, countdown: 'Kick-off 7h 12m', crew: 'Rami and Marco are in' },
      { time: '21:00', venue: 'Insportz Indoor', meta: '7-a-side · indoor', tier: 'Your level', price: 'AED 50', taken: 8, total: 14, countdown: 'Kick-off 7h 42m', crew: 'Room to spare — bring someone' },
    ];

    const say = (d) => {
      const left = d.total - d.taken;
      if (left <= 0) { return 'Full — waitlist'; }
      if (left === 1) { return 'One shirt left!'; }
      return left + ' shirts left';
    };

    const palette = [
      { bg: '#E5342A', fg: '#FFFFFF' },
      { bg: '#FFC42E', fg: '#14141B' },
      { bg: '#2050E0', fg: '#FFFFFF' },
      { bg: '#FFFFFF', fg: '#14141B' },
      { bg: '#1F9E55', fg: '#FFFFFF' },
    ];
    const names = ['RK', 'MA', 'DS', 'JT', 'SH'];

    const i = this.state.hero;
    const h = defs[i];
    const full = h.total - h.taken <= 0;
    const booked = this.state.booked;

    const faces = names.map((n, k) => ({
      label: n,
      bg: palette[k].bg,
      fg: palette[k].fg,
      shift: k === 0 ? '0' : '-10px',
      delay: (0.24 + k * 0.06) + 's',
    }));

    let ctaLabel = 'TAKE A SHIRT · ' + h.price;
    if (booked) { ctaLabel = "YOU'RE IN!"; }
    else if (full) { ctaLabel = 'JOIN THE WAITLIST'; }

    const others = [];
    defs.forEach((d, k) => {
      if (k === i) { return; }
      const isFull = d.total - d.taken <= 0;
      others.push({
        time: d.time,
        venue: d.venue,
        price: d.price,
        status: say(d),
        chipBg: isFull ? '#EFE9DA' : '#7FC4F5',
        chipFg: '#14141B',
        statusColor: isFull ? '#5A5A66' : '#E5342A',
        delay: (others.length * 0.08 + 0.3) + 's',
        pick: () => this.setState({ hero: k, booked: false }),
      });
    });

    const navDefs = [
      { id: 'play', label: 'Play', icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 8l4 3-1.5 4.5h-5L8 11z' },
      { id: 'season', label: 'Season', icon: 'M4 20V9M10 20V4M16 20v-7M22 20H2' },
      { id: 'crew', label: 'Crew', icon: 'M16 20v-2a4 4 0 0 0-8 0v2M12 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.3' },
      { id: 'you', label: 'You', icon: 'M5 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8' },
    ];
    const nav = navDefs.map((n) => {
      const on = n.id === 'play';
      return {
        label: n.label,
        icon: n.icon,
        color: on ? '#14141B' : '#8C8C99',
        bg: on ? '#FFC42E' : 'transparent',
        border: on ? '2.5px solid #14141B' : '2.5px solid transparent',
        pick: () => {},
      };
    });

    return {
      hero: { time: h.time, venue: h.venue, meta: h.meta, tier: h.tier, price: h.price, countdown: h.countdown, crew: h.crew, faces: faces },
      others: others,
      nav: nav,
      ctaLabel: ctaLabel,
      ctaBg: booked ? '#1F9E55' : '#E5342A',
      ctaFg: '#FFFFFF',
      book: () => this.setState({ booked: !booked }),
    };
  }
}
</script>
</body>
</html>
