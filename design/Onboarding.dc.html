<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,800;1,600;1,800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E5342A; } a:hover { color: #B8241C; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .impact { font-family: Kanit, 'Arial Narrow', Impact, sans-serif; font-weight: 800; font-style: italic; letter-spacing: -.02em; }
    .sub { font-family: Kanit, 'Arial Narrow', sans-serif; font-weight: 600; font-style: italic; letter-spacing: .04em; text-transform: uppercase; }
    .halftone { background-image: radial-gradient(rgba(20,20,27,.26) 1.3px, transparent 1.4px); background-size: 6px 6px; }
    .ink { border: 3px solid #14141B; }
    .drop { box-shadow: 5px 5px 0 #14141B; }
    .drop-sm { box-shadow: 3px 3px 0 #14141B; }
    .tap { cursor: pointer; transition: transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s ease, background .2s ease; }
    .tap:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #14141B; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
    @keyframes slam { 0% { opacity: 0; transform: translateY(-14px) scale(1.2); } 60% { transform: translateY(2px) scale(.98); } 100% { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F2E7; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Helvetica Neue', Arial, sans-serif; color: #14141B; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 26px 18px 14px; display: flex; flex-direction: column; gap: 7px;">
    <div class="sub" style="font-size: 10.5px; color: #E5342A;">Step 1 of 2</div>
    <div class="impact" style="font-size: 40px; line-height: .9; text-shadow: 3px 3px 0 #14141B; color: #F6F2E7; -webkit-text-stroke: 2.5px #14141B; animation: slam .5s cubic-bezier(.34,1.56,.64,1) both;">WHERE DO<br>YOU PLAY?</div>
    <div style="font-size: 13.5px; font-weight: 700; line-height: 1.45; color: #5A5A66;">Rough is fine. We only need somewhere to start you.</div>
  </div>

  <div style="padding: 0 18px; flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">

    <sc-for list="{{levels}}" as="l" hint-placeholder-count="4">
      <div class="tap ink drop-sm" onClick="{{ l.pick }}" style="background: {{l.bg}}; color: {{l.fg}}; padding: 13px 14px; min-height: 62px; display: flex; align-items: center; gap: 13px; animation: slideIn .4s cubic-bezier(.22,1,.36,1) both; animation-delay: {{l.delay}};">
        <div class="ink impact" style="width: 38px; height: 38px; border-width: 2.5px; background: {{l.chipBg}}; color: {{l.chipFg}}; font-size: 19px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{l.n}}</div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 15px; font-weight: 900; letter-spacing: -.01em;">{{l.title}}</div>
          <div style="font-size: 11.5px; font-weight: 500; line-height: 1.35; color: {{l.metaFg}};">{{l.body}}</div>
        </div>
        <sc-if value="{{l.on}}" hint-placeholder-val="{{ true }}">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
        </sc-if>
      </div>
    </sc-for>

    <div class="ink drop-sm" style="background: #FFC42E; padding: 13px 14px; display: flex; gap: 11px; transform: rotate(-.5deg); margin-top: 2px;">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#14141B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
      <div style="font-size: 12.5px; font-weight: 700; line-height: 1.45;">You can't get this wrong. Two games in, the result and the person running it will have moved you to where you actually belong.</div>
    </div>

    <div style="height: 4px;"></div>
  </div>

  <div style="padding: 12px 18px 20px; background: #F6F2E7; border-top: 3px solid #14141B;">
    <div class="tap ink drop" onClick="{{ next }}" style="background: {{ctaBg}}; color: {{ctaFg}}; min-height: 54px; display: flex; align-items: center; justify-content: center; gap: 9px;">
      <span class="impact" style="font-size: 21px;">{{ctaLabel}}</span>
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="{{ctaFg}}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"></path></svg>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const picked = this.state?.picked ?? null;

    const defs = [
      { id: 'a', n: '1', title: 'Just starting out', body: 'New to organised games, or coming back after years off.' },
      { id: 'b', n: '2', title: 'I play now and then', body: 'A kickabout when someone organises one.' },
      { id: 'c', n: '3', title: 'I play regularly', body: 'Weekly or close to it. Comfortable in a decent game.' },
      { id: 'd', n: '4', title: 'I played at a level', body: 'Academy, semi-pro, university or club football.' },
    ];

    const levels = defs.map((d, i) => {
      const on = picked === d.id;
      return {
        n: d.n,
        title: d.title,
        body: d.body,
        on: on,
        bg: on ? '#E5342A' : '#FFFFFF',
        fg: on ? '#FFFFFF' : '#14141B',
        metaFg: on ? 'rgba(255,255,255,.82)' : '#5A5A66',
        chipBg: on ? '#FFC42E' : '#F6F2E7',
        chipFg: '#14141B',
        delay: (0.04 + i * 0.06).toFixed(2) + 's',
        pick: () => this.setState({ picked: d.id }),
      };
    });

    return {
      levels: levels,
      ctaLabel: picked ? 'NEXT' : 'PICK ONE',
      ctaBg: picked ? '#E5342A' : '#D8D2C2',
      ctaFg: picked ? '#FFFFFF' : '#8C8C99',
      next: () => {},
    };
  }
}
</script>
</body>
</html>
