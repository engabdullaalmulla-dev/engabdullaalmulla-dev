<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,800;1,600;1,800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E5342A; } a:hover { color: #B8241C; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .impact { font-family: Kanit, 'Arial Narrow', Impact, sans-serif; font-weight: 800; font-style: italic; letter-spacing: -.02em; }
    .sub { font-family: Kanit, 'Arial Narrow', sans-serif; font-weight: 600; font-style: italic; letter-spacing: .04em; text-transform: uppercase; }
    .halftone { background-image: radial-gradient(rgba(20,20,27,.24) 1.3px, transparent 1.4px); background-size: 6px 6px; }
    .ink { border: 3px solid #14141B; }
    .drop { box-shadow: 5px 5px 0 #14141B; }
    .drop-sm { box-shadow: 3px 3px 0 #14141B; }
    .tap { cursor: pointer; transition: transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s ease, background .2s ease, color .2s ease; }
    .tap:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #14141B; }
    @keyframes zoomIn { 0% { opacity: 0; transform: scale(.9); } 65% { transform: scale(1.015); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes slam { 0% { opacity: 0; transform: translateY(-16px) scale(1.3); } 62% { transform: translateY(2px) scale(.97); } 100% { opacity: 1; transform: none; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F2E7; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Helvetica Neue', Arial, sans-serif; color: #14141B; display: flex; flex-direction: column; overflow: hidden;">

  <!-- character card -->
  <div style="padding: 20px 18px 0;">
    <div class="ink drop" style="position: relative; overflow: hidden; background: #E5342A; animation: zoomIn .55s cubic-bezier(.34,1.56,.64,1) both;">
      <div style="position: absolute; left: 68%; top: 30%; width: 520px; height: 520px; margin: -260px 0 0 -260px; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.24) 0deg 6deg, transparent 6deg 14deg);"></div>
      <div class="halftone" style="position: absolute; inset: 0; opacity: .32;"></div>
      <div class="impact" style="position: absolute; right: -10px; top: -40px; font-size: 190px; line-height: 1; color: rgba(255,255,255,.24);">8</div>

      <div style="position: relative; padding: 16px; display: flex; flex-direction: column; gap: 14px;">

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <div class="ink sub" style="border-width: 2.5px; background: #FFC42E; padding: 5px 10px; font-size: 10px;">Level 4 · Midfield</div>
          <div class="sub" style="font-size: 9.5px; color: #FFFFFF;">Since 2024</div>
        </div>

        <div style="display: flex; align-items: center; gap: 13px;">
          <div class="ink" style="width: 62px; height: 62px; border-radius: 999px; border-width: 3px; background: #FFC42E; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; flex-shrink: 0; box-shadow: 3px 3px 0 #14141B;">AA</div>
          <div style="display: flex; flex-direction: column; gap: 0; min-width: 0;">
            <div class="impact" style="font-size: 32px; line-height: .92; color: #FFFFFF; text-shadow: 3px 3px 0 #14141B;">ABDULLA</div>
            <div class="impact" style="font-size: 32px; line-height: .92; color: #FFFFFF; text-shadow: 3px 3px 0 #14141B;">ALMULLA</div>
          </div>
        </div>

        <div style="display: flex; gap: 7px;">
          <sc-for list="{{cardStats}}" as="s" hint-placeholder-count="4">
            <div class="ink" style="flex-grow: 1; border-width: 2.5px; background: {{s.bg}}; padding: 8px 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; animation: slam .45s cubic-bezier(.34,1.56,.64,1) both; animation-delay: {{s.delay}};">
              <div class="impact" style="font-size: 22px; line-height: 1; color: {{s.color}};">{{s.value}}</div>
              <div class="sub" style="font-size: 7.5px; color: #5A5A66; text-align: center;">{{s.label}}</div>
            </div>
          </sc-for>
        </div>

      </div>
    </div>
  </div>

  <!-- tabs -->
  <div style="padding: 16px 18px 12px; display: flex; gap: 7px;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <div class="tap ink" onClick="{{ t.pick }}" style="flex-grow: 1; min-height: 44px; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.shadow}}; display: flex; align-items: center; justify-content: center;">
        <span class="sub" style="font-size: 10.5px;">{{t.label}}</span>
      </div>
    </sc-for>
  </div>

  <div style="padding: 0 18px; flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;">

    <sc-if value="{{isForm}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 11px;">
        <div style="display: flex; gap: 6px;">
          <sc-for list="{{form}}" as="r" hint-placeholder-count="6">
            <div class="impact ink" style="flex-grow: 1; height: 46px; border-width: 2.5px; background: {{r.bg}}; color: {{r.fg}}; display: flex; align-items: center; justify-content: center; font-size: 19px; box-shadow: 2px 2px 0 #14141B;">{{r.result}}</div>
          </sc-for>
        </div>
        <sc-for list="{{recent}}" as="g" hint-placeholder-count="4">
          <div class="ink drop-sm" style="background: #FFFFFF; padding: 10px 12px; display: flex; align-items: center; gap: 12px; animation: slideIn .4s cubic-bezier(.22,1,.36,1) both; animation-delay: {{g.delay}};">
            <div class="impact ink" style="font-size: 18px; border-width: 2.5px; background: {{g.scoreBg}}; color: {{g.scoreFg}}; padding: 7px 8px; min-width: 62px; text-align: center;">{{g.score}}</div>
            <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
              <div style="font-size: 14px; font-weight: 900; letter-spacing: -.01em;">{{g.venue}}</div>
              <div style="font-size: 11.5px; font-weight: 500; color: #5A5A66;">{{g.meta}}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isBadges}}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <sc-for list="{{badges}}" as="b" hint-placeholder-count="6">
          <div class="ink" style="background: {{b.bg}}; box-shadow: {{b.shadow}}; padding: 13px 12px; display: flex; flex-direction: column; gap: 7px; animation: slideIn .4s cubic-bezier(.22,1,.36,1) both; animation-delay: {{b.delay}};">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="{{b.stroke}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg>
            <div class="impact" style="font-size: 16px; line-height: 1.05; color: {{b.titleColor}};">{{b.title}}</div>
            <div style="font-size: 11px; font-weight: 500; line-height: 1.35; color: {{b.metaColor}};">{{b.meta}}</div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isCities}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="font-size: 13px; font-weight: 500; line-height: 1.55; color: #3C3C48;">Your card travels. Land anywhere we run and you are in the right game that night — no starting again.</div>
        <sc-for list="{{cities}}" as="c" hint-placeholder-count="5">
          <div class="ink drop-sm" style="background: {{c.bg}}; padding: 12px 13px; display: flex; align-items: center; gap: 12px; animation: slideIn .4s cubic-bezier(.22,1,.36,1) both; animation-delay: {{c.delay}};">
            <div class="ink" style="width: 12px; height: 12px; border-radius: 999px; border-width: 2.5px; background: {{c.dot}}; flex-shrink: 0;"></div>
            <div class="impact" style="font-size: 19px; flex-grow: 1; color: {{c.nameColor}};">{{c.name}}</div>
            <div style="font-size: 11.5px; font-weight: 700; color: {{c.metaColor}};">{{c.meta}}</div>
          </div>
        </sc-for>
      </div>
    </sc-if>

  </div>

  <div style="padding: 12px 18px 20px;">
    <div class="tap ink drop-sm" style="background: #2050E0; color: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; gap: 11px;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 15V3M8 7l4-4 4 4"></path></svg>
      <span class="impact" style="font-size: 17px; flex-grow: 1;">SHARE YOUR CARD</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'form' };
  }

  renderVals() {
    const tab = this.state.tab;

    const tabDefs = [
      { id: 'form', label: 'Form' },
      { id: 'badges', label: 'Trophies' },
      { id: 'cities', label: 'Cities' },
    ];
    const tabs = tabDefs.map((t) => {
      const on = t.id === tab;
      return {
        label: t.label,
        bg: on ? '#14141B' : '#FFFFFF',
        fg: on ? '#F6F2E7' : '#14141B',
        shadow: on ? '3px 3px 0 #14141B' : 'none',
        pick: () => this.setState({ tab: t.id }),
      };
    });

    const formDefs = [
      { result: 'W', win: true }, { result: 'W', win: true }, { result: 'W', win: true },
      { result: 'L', win: false }, { result: 'D', win: null }, { result: 'W', win: true },
    ];
    const form = formDefs.map((f) => ({
      result: f.result,
      bg: f.win === true ? '#1F9E55' : (f.win === false ? '#EFE9DA' : '#FFC42E'),
      fg: f.win === true ? '#FFFFFF' : '#14141B',
    }));

    const recentDefs = [
      { score: '6-5', venue: 'Al Quoz Sports Park', meta: 'Thursday · you bagged 2', win: true },
      { score: '3-3', venue: 'The Sevens', meta: 'Tuesday · one goal', win: null },
      { score: '4-7', venue: 'Insportz Indoor', meta: 'Sunday · one of those nights', win: false },
      { score: '5-2', venue: 'Zabeel Park', meta: 'Friday · one assist', win: true },
    ];
    const recent = recentDefs.map((g, i) => ({
      score: g.score,
      venue: g.venue,
      meta: g.meta,
      scoreBg: g.win === true ? '#1F9E55' : (g.win === false ? '#EFE9DA' : '#FFC42E'),
      scoreFg: g.win === true ? '#FFFFFF' : '#14141B',
      delay: (i * 0.06) + 's',
    }));

    const badgeDefs = [
      { title: 'ALWAYS THERE', meta: 'Twenty games, twenty arrivals', earned: true, icon: 'M20 6 9 17l-5-5' },
      { title: 'ON A RUN', meta: 'Every Thursday since June', earned: true, icon: 'M13 2 4 14h6l-1 8 9-12h-6z' },
      { title: 'CROWD FAVOURITE', meta: 'Man of the match eighteen times', earned: true, icon: 'm12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.4l6.1-.8z' },
      { title: 'THE GAFFER', meta: 'Ran four games for others', earned: true, icon: 'M16 20v-2a4 4 0 0 0-8 0v2M12 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7' },
      { title: 'LEVEL FIVE', meta: 'Two wins away', earned: false, icon: 'M12 19V5M6 11l6-6 6 6' },
      { title: 'FREQUENT FLYER', meta: 'Three cities — two so far', earned: false, icon: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M3 12h18M12 3c2.5 2.6 2.5 15 0 18' },
    ];
    const badges = badgeDefs.map((b, i) => ({
      title: b.title,
      meta: b.meta,
      icon: b.icon,
      bg: b.earned ? '#FFFFFF' : '#EFE9DA',
      shadow: b.earned ? '3px 3px 0 #14141B' : 'none',
      stroke: b.earned ? '#E5342A' : '#9A9AA6',
      titleColor: b.earned ? '#14141B' : '#9A9AA6',
      metaColor: b.earned ? '#5A5A66' : '#9A9AA6',
      delay: (i * 0.055) + 's',
    }));

    const cityDefs = [
      { name: 'DUBAI', meta: '38 games · home', live: true },
      { name: 'ABU DHABI', meta: '3 games', live: true },
      { name: 'DOHA', meta: 'Ready when you land', live: true },
      { name: 'RIYADH', meta: 'Ready when you land', live: true },
      { name: 'LONDON', meta: 'Opening this winter', live: false },
    ];
    const cities = cityDefs.map((c, i) => ({
      name: c.name,
      meta: c.meta,
      dot: c.live ? '#1F9E55' : '#CFC8B6',
      bg: c.live ? '#FFFFFF' : '#EFE9DA',
      nameColor: c.live ? '#14141B' : '#9A9AA6',
      metaColor: c.live ? '#5A5A66' : '#9A9AA6',
      delay: (i * 0.055) + 's',
    }));

    return {
      tabs: tabs,
      isForm: tab === 'form',
      isBadges: tab === 'badges',
      isCities: tab === 'cities',
      cardStats: [
        { value: '41', label: 'Games', color: '#14141B', bg: '#FFFFFF', delay: '.3s' },
        { value: '23', label: 'Goals', color: '#14141B', bg: '#FFC42E', delay: '.37s' },
        { value: '98%', label: 'Turned up', color: '#14141B', bg: '#FFFFFF', delay: '.44s' },
        { value: '11', label: 'Streak', color: '#FFFFFF', bg: '#2050E0', delay: '.51s' },
      ],
      form: form,
      recent: recent,
      badges: badges,
      cities: cities,
    };
  }
}
</script>
</body>
</html>
