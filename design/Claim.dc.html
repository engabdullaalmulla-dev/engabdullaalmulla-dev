<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,800;1,600;1,800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E5342A; } a:hover { color: #B8241C; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .impact { font-family: Kanit, 'Arial Narrow', Impact, sans-serif; font-weight: 800; font-style: italic; letter-spacing: -.02em; }
    .sub { font-family: Kanit, 'Arial Narrow', sans-serif; font-weight: 600; font-style: italic; letter-spacing: .04em; text-transform: uppercase; }
    .halftone { background-image: radial-gradient(rgba(20,20,27,.26) 1.3px, transparent 1.4px); background-size: 6px 6px; }
    .halftone-lt { background-image: radial-gradient(rgba(255,255,255,.30) 1.2px, transparent 1.3px); background-size: 5px 5px; }
    .speed { background-image: repeating-conic-gradient(from 0deg at 50% 44%, rgba(20,20,27,.14) 0deg 1deg, transparent 1deg 3deg); }
    .burst { background-image: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.30) 0deg 3deg, transparent 3deg 8deg); }
    .ink { border: 3px solid #14141B; }
    .drop { box-shadow: 5px 5px 0 #14141B; }
    .drop-sm { box-shadow: 3px 3px 0 #14141B; }
    .tap { cursor: pointer; transition: transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s ease, background .2s ease; }
    .tap:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #14141B; }
    @keyframes slam { 0% { opacity: 0; transform: translateY(-16px) scale(1.22); } 60% { transform: translateY(2px) scale(.98); } 100% { opacity: 1; transform: none; } }
    @keyframes flash { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F2E7; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Helvetica Neue', Arial, sans-serif; color: #14141B; display: flex; flex-direction: column; overflow: hidden;">

  <!-- full-bleed alert panel -->
  <div style="position: relative; overflow: hidden; background: {{panel.bg}}; border-bottom: 3px solid #14141B; flex-shrink: 0;">
    <div class="speed" style="position: absolute; inset: 0;"></div>
    <div class="burst" style="position: absolute; left: 50%; top: 44%; width: 620px; height: 620px; margin-left: -310px; margin-top: -310px; opacity: {{panel.burst}};"></div>
    <div class="halftone-lt" style="position: absolute; inset: 0; opacity: .34;"></div>

    <div style="position: relative; padding: 30px 18px 24px; display: flex; flex-direction: column; align-items: center; gap: 13px;">
      <div class="ink sub" style="display: flex; align-items: center; gap: 7px; background: #14141B; color: #FFC42E; border-width: 2.5px; padding: 6px 11px; font-size: 10.5px;">
        <span style="width: 7px; height: 7px; border-radius: 999px; background: #FFC42E; animation: flash 1.1s ease-in-out infinite;"></span>
        {{panel.flag}}
      </div>
      <div class="impact" style="font-size: {{panel.size}}; line-height: .86; color: #FFFFFF; text-shadow: 4px 4px 0 #14141B; text-align: center; white-space: pre-line; animation: slam .5s cubic-bezier(.34,1.56,.64,1) both;">{{panel.headline}}</div>
      <div class="ink drop-sm" style="background: #FFC42E; border-width: 2.5px; padding: 6px 12px; transform: rotate(-1.6deg);">
        <span class="sub" style="font-size: 11px;">{{panel.tag}}</span>
      </div>
    </div>
  </div>

  <div style="padding: 16px 18px 0; flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 13px;">

    <div class="ink drop-sm" style="background: #FFFFFF; padding: 14px; display: flex; align-items: center; gap: 13px;">
      <div class="ink" style="width: 52px; height: 52px; border-width: 2.5px; background: #1F9E55; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; color: #FFFFFF;">
        <div class="impact" style="font-size: 20px; line-height: 1;">22</div>
        <div class="sub" style="font-size: 8.5px;">SEP</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
        <div style="font-size: 15.5px; font-weight: 900; letter-spacing: -.01em;">Al Barsha · Pitch 1</div>
        <div style="font-size: 11.5px; font-weight: 500; color: #5A5A66;">Tuesday 20:30 · 7-a-side · Level 3–4</div>
      </div>
      <div class="impact" style="font-size: 19px; color: #E5342A; flex-shrink: 0;">AED 45</div>
    </div>

    <div class="ink drop-sm" style="background: #FFFFFF; padding: 13px 14px; display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
        <div style="display: flex; align-items: flex-start; gap: 11px; animation: slideIn .4s cubic-bezier(.22,1,.36,1) both; animation-delay: {{f.delay}};">
          <div class="ink" style="width: 22px; height: 22px; border-width: 2.5px; background: {{f.bg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{f.icon}}"></path></svg>
          </div>
          <div style="font-size: 13px; font-weight: 700; line-height: 1.4;">{{f.text}}</div>
        </div>
      </sc-for>
    </div>

    <div style="font-size: 11.5px; font-weight: 500; line-height: 1.5; color: #8C8C99; padding: 0 2px;">Tariq let us know he can't make it. Taking this place refunds him in full — that's how the guarantee actually works.</div>

    <div style="height: 4px;"></div>
  </div>

  <div style="padding: 12px 18px 20px; background: #F6F2E7; border-top: 3px solid #14141B; display: flex; flex-direction: column; gap: 9px;">
    <div class="tap ink drop" onClick="{{ claim }}" style="background: {{ctaBg}}; color: #FFFFFF; min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <span class="impact" style="font-size: 22px;">{{ctaLabel}}</span>
    </div>
    <div class="tap" onClick="{{ pass }}" style="display: flex; align-items: center; justify-content: center; padding: 6px 0;">
      <span class="sub" style="font-size: 10.5px; color: #8C8C99;">Not tonight</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const claimed = this.state?.claimed ?? false;

    const panel = claimed
      ? { bg: '#1F9E55', flag: "You're in", headline: 'SHIRT 8\nIS YOURS', tag: 'See you Thursday', size: '48px', burst: '.5' }
      : { bg: '#E5342A', flag: 'Two people looking at this', headline: 'A PLACE\nJUST OPENED', tag: 'First to claim it', size: '46px', burst: '.3' };

    const facts = claimed
      ? [
          { text: 'Paid. Your place is held.', bg: '#1F9E55', icon: 'M20 6L9 17l-5-5', delay: '.05s' },
          { text: 'Teams drop in the group at 18:30.', bg: '#2050E0', icon: 'M12 8v4l3 2M12 3a9 9 0 100 18 9 9 0 000-18z', delay: '.14s' },
          { text: 'Same deal for you — tell us and we pass it on.', bg: '#14141B', icon: 'M20 6L9 17l-5-5', delay: '.23s' },
        ]
      : [
          { text: 'Nine already confirmed, four places left after this one.', bg: '#1F9E55', icon: 'M20 6L9 17l-5-5', delay: '.05s' },
          { text: 'Two of your crew are already in.', bg: '#2050E0', icon: 'M17 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 7a4 4 0 108 0 4 4 0 00-8 0', delay: '.14s' },
          { text: "It's in your level band, so the sides stay even.", bg: '#14141B', icon: 'M3 12h5M16 12h5M12 4v16', delay: '.23s' },
        ];

    return {
      panel: { bg: panel.bg, flag: panel.flag, headline: panel.headline, tag: panel.tag, size: panel.size, burst: panel.burst },
      facts: facts,
      ctaLabel: claimed ? 'ADDED TO YOUR GAMES' : 'TAKE IT — AED 45',
      ctaBg: claimed ? '#1F9E55' : '#E5342A',
      claim: () => this.setState({ claimed: !claimed }),
      pass: () => {},
    };
  }
}
</script>
</body>
</html>
