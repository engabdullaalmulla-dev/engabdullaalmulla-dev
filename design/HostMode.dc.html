<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1F4A3A; } a:hover { color: #16382C; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .card { border-radius: 22px; box-shadow: 0 1px 2px rgba(26,29,26,.05), 0 14px 34px -16px rgba(26,29,26,.26); }
    .tap { cursor: pointer; transition: transform .5s cubic-bezier(.22,1,.36,1), background .3s ease, border-color .3s ease, color .3s ease; }
    .tap:active { transform: scale(.982); }
    @keyframes ease-in-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F5F3EF; font-family: Manrope, 'Helvetica Neue', Arial, sans-serif; color: #1A1D1A; display: flex; flex-direction: column; overflow: hidden;">

  <!-- header -->
  <div style="padding: 30px 24px 0;">
    <div class="card" style="background: #1F4A3A; color: #FFFFFF; padding: 24px; display: flex; flex-direction: column; gap: 22px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #A7C6B6;">You are hosting</div>
        <div style="border-radius: 999px; background: rgba(255,255,255,.16); font-size: 11px; font-weight: 700; padding: 6px 11px;">You play free</div>
      </div>

      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
          <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 40px; line-height: .98; letter-spacing: -.015em;">Tonight, 19:00</div>
          <div style="font-size: 13px; font-weight: 500; color: #A7C6B6;">Al Quoz Sports Park · Pitch 3</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0;">
          <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 38px; line-height: .94;">{{checkedIn}}<span style="font-size: 20px; color: #A7C6B6;">/13</span></div>
          <div style="font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #A7C6B6;">Here</div>
        </div>
      </div>
    </div>
  </div>

  <!-- figures -->
  <div style="display: flex; padding: 18px 24px 16px; gap: 10px;">
    <sc-for list="{{figures}}" as="f" hint-placeholder-count="3">
      <div style="flex-grow: 1; background: #FFFFFF; border-radius: 18px; padding: 15px 14px; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; line-height: 1; color: {{f.color}};">{{f.value}}</div>
        <div style="font-size: 11.5px; font-weight: 600; color: #8E938C;">{{f.label}}</div>
      </div>
    </sc-for>
  </div>

  <!-- roster -->
  <div style="padding: 0 24px; flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 2px;">
      <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 24px; line-height: 1.1;">Tonight's players</div>
      <div style="font-size: 12.5px; font-weight: 500; color: #8E938C;">tap to tick in</div>
    </div>

    <sc-for list="{{roster}}" as="p" hint-placeholder-count="6">
      <div class="tap" onClick="{{ p.toggle }}" style="background: {{p.bg}}; border: 1.5px solid {{p.border}}; border-radius: 18px; padding: 13px 16px; display: flex; align-items: center; gap: 14px; animation: ease-in-up .28s cubic-bezier(.22,1,.36,1) both; animation-delay: {{p.delay}};">
        <div style="width: 34px; height: 34px; border-radius: 999px; border: 1.5px solid {{p.boxBorder}}; background: {{p.boxBg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="{{p.tick}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; color: {{p.nameColor}};">{{p.name}}</div>
          <div style="font-size: 12.5px; font-weight: 500; color: #8E938C;">{{p.meta}}</div>
        </div>
        <div style="font-size: 13px; font-weight: 700; color: #A8894F; font-variant-numeric: tabular-nums;">{{p.tier}}</div>
      </div>
    </sc-for>

    <div style="display: flex; align-items: center; justify-content: center; padding: 10px 0 18px;">
      <div style="font-size: 13px; font-weight: 600; color: #8E938C;">and seven more booked</div>
    </div>
  </div>

  <!-- action -->
  <div style="padding: 14px 24px 26px; display: flex; flex-direction: column; gap: 13px;">
    <div class="tap" onClick="{{ build }}" style="min-height: 58px; border-radius: 999px; background: {{ctaBg}}; color: {{ctaFg}}; border: 1.5px solid {{ctaBorder}}; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 16px; font-weight: 700; letter-spacing: -.01em;">{{ctaLabel}}</span>
    </div>
    <div style="display: flex; align-items: center; gap: 9px; justify-content: center;">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#8E938C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
      <div style="font-size: 13px; font-weight: 500; color: #5C625B;">You never have to chase anyone for money.</div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { present: { rk: true, ma: true, ds: true }, built: false };
  }

  renderVals() {
    const present = this.state.present;

    const rosterDefs = [
      { id: 'rk', name: 'Rami K.', meta: 'Never missed a game', tier: '4' },
      { id: 'ma', name: 'Marco A.', meta: 'Usually in goal', tier: '5' },
      { id: 'ds', name: 'Deepak S.', meta: '12 games this season', tier: '4' },
      { id: 'jt', name: 'Jonas T.', meta: 'First game — say hello', tier: '3' },
      { id: 'pn', name: 'Paolo N.', meta: 'Missed last week', tier: '3' },
      { id: 'oz', name: 'Omar Z.', meta: '34 games this season', tier: '2' },
    ];

    const roster = rosterDefs.map((p, i) => {
      const on = !!present[p.id];
      return {
        name: p.name,
        meta: p.meta,
        tier: p.tier,
        bg: on ? '#FFFFFF' : 'transparent',
        border: on ? 'transparent' : '#E4E1DA',
        boxBg: on ? '#1F4A3A' : 'transparent',
        boxBorder: on ? '#1F4A3A' : '#D6D2C9',
        tick: on ? '#FFFFFF' : 'transparent',
        nameColor: on ? '#1A1D1A' : '#5C625B',
        delay: (i * 0.04) + 's',
        toggle: () => {
          const next = Object.assign({}, this.state.present);
          if (next[p.id]) { delete next[p.id]; } else { next[p.id] = true; }
          this.setState({ present: next, built: false });
        },
      };
    });

    const count = Object.keys(present).length;
    const ready = count >= 6;
    const built = this.state.built && ready;

    let label = 'Waiting on players';
    if (built) { label = 'Sides sent to everyone'; }
    else if (ready) { label = 'Make the sides'; }

    return {
      roster: roster,
      checkedIn: count,
      figures: [
        { value: '13', label: 'Booked', color: '#1A1D1A' },
        { value: '210', label: 'Your fee, AED', color: '#1F4A3A' },
        { value: '1', label: 'Place open', color: '#A8894F' },
      ],
      ctaLabel: label,
      ctaBg: built ? '#1F4A3A' : (ready ? '#1A1D1A' : 'transparent'),
      ctaFg: ready ? '#FFFFFF' : '#A8ADA6',
      ctaBorder: ready ? 'transparent' : '#D6D2C9',
      build: () => { if (ready) { this.setState({ built: !this.state.built }); } },
    };
  }
}
</script>
</body>
</html>
