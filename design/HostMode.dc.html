<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,600;0,800;1,600;1,800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E5342A; } a:hover { color: #B8241C; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .impact { font-family: Kanit, 'Arial Narrow', Impact, sans-serif; font-weight: 800; font-style: italic; letter-spacing: -.02em; }
    .sub { font-family: Kanit, 'Arial Narrow', sans-serif; font-weight: 600; font-style: italic; letter-spacing: .04em; text-transform: uppercase; }
    .halftone { background-image: radial-gradient(rgba(20,20,27,.24) 1.3px, transparent 1.4px); background-size: 6px 6px; }
    .ink { border: 3px solid #14141B; }
    .drop { box-shadow: 5px 5px 0 #14141B; }
    .drop-sm { box-shadow: 3px 3px 0 #14141B; }
    .tap { cursor: pointer; transition: transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s ease, background .2s ease, color .2s ease; }
    .tap:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #14141B; }
    @keyframes zoomIn { 0% { opacity: 0; transform: scale(.92); } 65% { transform: scale(1.012); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F6F2E7; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Helvetica Neue', Arial, sans-serif; color: #14141B; display: flex; flex-direction: column; overflow: hidden;">

  <!-- header panel -->
  <div style="padding: 20px 18px 0;">
    <div class="ink drop" style="position: relative; overflow: hidden; background: #2050E0; animation: zoomIn .5s cubic-bezier(.34,1.56,.64,1) both;">
      <div style="position: absolute; left: 22%; top: 10%; width: 460px; height: 460px; margin: -230px 0 0 -230px; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.20) 0deg 6deg, transparent 6deg 14deg);"></div>
      <div class="halftone" style="position: absolute; inset: 0; opacity: .3;"></div>

      <div style="position: relative; padding: 16px; display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <div class="ink sub drop-sm" style="border-width: 2.5px; background: #FFC42E; padding: 5px 10px; font-size: 10px; transform: rotate(-2deg);">You're the gaffer</div>
          <div class="ink sub" style="border-width: 2.5px; border-color: #FFFFFF; color: #FFFFFF; padding: 5px 10px; font-size: 10px;">You play free</div>
        </div>

        <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
            <div class="impact" style="font-size: 40px; line-height: .88; color: #FFFFFF; text-shadow: 3px 3px 0 #14141B;">TONIGHT<br>19:00</div>
            <div style="font-size: 11.5px; font-weight: 700; color: #FFFFFF;">Al Quoz · Pitch 3</div>
          </div>
          <div class="ink" style="border-width: 2.5px; background: #F6F2E7; padding: 8px 12px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0;">
            <div class="impact" style="font-size: 30px; line-height: 1;">{{checkedIn}}</div>
            <div class="sub" style="font-size: 7.5px;">of 13 here</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- figures -->
  <div style="display: flex; padding: 16px 18px 12px; gap: 8px;">
    <sc-for list="{{figures}}" as="f" hint-placeholder-count="3">
      <div class="ink drop-sm" style="flex-grow: 1; background: {{f.bg}}; padding: 10px 10px; display: flex; flex-direction: column; gap: 1px;">
        <div class="impact" style="font-size: 23px; line-height: 1; color: {{f.color}};">{{f.value}}</div>
        <div class="sub" style="font-size: 7.5px; color: {{f.labelColor}};">{{f.label}}</div>
      </div>
    </sc-for>
  </div>

  <!-- roster -->
  <div style="padding: 0 18px; flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 2px;">
      <div class="impact" style="font-size: 22px;">TICK THEM IN</div>
      <div class="sub" style="font-size: 9.5px; color: #5A5A66; white-space: nowrap;">tap a name</div>
    </div>

    <sc-for list="{{roster}}" as="p" hint-placeholder-count="6">
      <div class="tap ink" onClick="{{ p.toggle }}" style="background: {{p.bg}}; box-shadow: {{p.shadow}}; padding: 9px 12px; display: flex; align-items: center; gap: 12px; animation: slideIn .38s cubic-bezier(.22,1,.36,1) both; animation-delay: {{p.delay}};">
        <div class="ink" style="width: 32px; height: 32px; border-width: 2.5px; background: {{p.boxBg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="{{p.tick}}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 0; flex-grow: 1; min-width: 0;">
          <div style="font-size: 14px; font-weight: 900; letter-spacing: -.01em;">{{p.name}}</div>
          <div style="font-size: 11px; font-weight: 500; color: #5A5A66;">{{p.meta}}</div>
        </div>
        <div class="ink sub" style="border-width: 2px; background: #EFE9DA; padding: 4px 8px; font-size: 8.5px; flex-shrink: 0;">Lv {{p.tier}}</div>
      </div>
    </sc-for>

    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 2px 14px;">
      <div style="height: 3px; background: #14141B; flex-grow: 1;"></div>
      <div class="sub" style="font-size: 9.5px; color: #5A5A66;">seven more booked</div>
      <div style="height: 3px; background: #14141B; flex-grow: 1;"></div>
    </div>
  </div>

  <!-- action -->
  <div style="padding: 12px 18px 20px; display: flex; flex-direction: column; gap: 10px;">
    <div class="tap ink" onClick="{{ build }}" style="min-height: 56px; background: {{ctaBg}}; color: {{ctaFg}}; box-shadow: {{ctaShadow}}; display: flex; align-items: center; justify-content: center;">
      <span class="impact" style="font-size: 19px;">{{ctaLabel}}</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; justify-content: center;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#5A5A66" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
      <div style="font-size: 11.5px; font-weight: 700; color: #5A5A66;">Never chase anyone for cash again.</div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { present: { rk: true, ma: true, ds: true }, built: false };
  }

  renderVals() {
    const present = this.state.present;

    const rosterDefs = [
      { id: 'rk', name: 'Rami K.', meta: 'Never missed a game', tier: '4' },
      { id: 'ma', name: 'Marco A.', meta: 'In goal, as always', tier: '5' },
      { id: 'ds', name: 'Deepak S.', meta: '12 games this season', tier: '4' },
      { id: 'jt', name: 'Jonas T.', meta: 'First game — say hello', tier: '3' },
      { id: 'pn', name: 'Paolo N.', meta: 'Pulled out last week', tier: '3' },
      { id: 'oz', name: 'Omar Z.', meta: '34 games this season', tier: '2' },
    ];

    const roster = rosterDefs.map((p, i) => {
      const on = !!present[p.id];
      return {
        name: p.name,
        meta: p.meta,
        tier: p.tier,
        bg: on ? '#D9F2E1' : '#FFFFFF',
        shadow: on ? '3px 3px 0 #14141B' : '2px 2px 0 #14141B',
        boxBg: on ? '#1F9E55' : '#FFFFFF',
        tick: on ? '#FFFFFF' : 'transparent',
        delay: (i * 0.05) + 's',
        toggle: () => {
          const next = Object.assign({}, this.state.present);
          if (next[p.id]) { delete next[p.id]; } else { next[p.id] = true; }
          this.setState({ present: next, built: false });
        },
      };
    });

    const count = Object.keys(present).length;
    const ready = count >= 6;
    const built = this.state.built && ready;

    let label = 'WAITING ON PLAYERS';
    if (built) { label = 'TEAMS SENT!'; }
    else if (ready) { label = 'PICK THE TEAMS'; }

    return {
      roster: roster,
      checkedIn: count,
      figures: [
        { value: '13', label: 'Booked', color: '#14141B', labelColor: '#5A5A66', bg: '#FFFFFF' },
        { value: '210', label: 'Your fee, AED', color: '#FFFFFF', labelColor: '#D9F2E1', bg: '#1F9E55' },
        { value: '1', label: 'Shirt left', color: '#FFFFFF', labelColor: '#FFD9D5', bg: '#E5342A' },
      ],
      ctaLabel: label,
      ctaBg: built ? '#1F9E55' : (ready ? '#E5342A' : '#EFE9DA'),
      ctaFg: ready ? '#FFFFFF' : '#8C8C99',
      ctaShadow: ready ? '3px 3px 0 #14141B' : 'none',
      build: () => { if (ready) { this.setState({ built: !this.state.built }); } },
    };
  }
}
</script>
</body>
</html>
