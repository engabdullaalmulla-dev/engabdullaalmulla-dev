<title>Café Life Art Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#171310; --panel:#231C18; --panel2:#2E2521; --edge:#3B302A; --edge2:#4A3C34;
  --cream:#F7EFE3; --cream2:#D9C9B6; --dim:#A8988A; --dimmer:#6F6058;
  --amber:#F2A03D; --amberL:#FFBC63; --amberD:#C97C22; --brass:#E8C36B;
  --green:#4FBF7B; --terra:#A8452A;
  --disp:"Bricolage Grotesque",-apple-system,system-ui,sans-serif;
  --body:"DM Sans",-apple-system,system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--cream);font-family:var(--body);margin:0;
     padding-inline:16px;padding-block:0 64px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:-.025em;margin:0;
         text-wrap:balance}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
     color:var(--dimmer)}

/* ---- sticky progress ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--ink);
     padding-block:14px 12px;border-bottom:1px solid var(--edge);margin-bottom:22px}
.bar .row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.bar h1{font-size:19px;flex:1;min-width:150px}
.count{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--brass);
       font-variant-numeric:tabular-nums}
.track{height:4px;border-radius:2px;background:var(--panel2);margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:var(--amber);width:0%;transition:width .25s}

/* ---- the card you work from ---- */
.now{background:var(--panel);border:1px solid var(--amberD);border-radius:16px;
     padding:18px;margin-bottom:14px;
     /* clear the sticky bar when advancing scrolls this into view */
     scroll-margin-top:calc(96px + env(safe-area-inset-top,0px))}
.now.scene{border-color:var(--amber);background:#2b2118}
.now-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.chip{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;
      background:var(--amber);color:var(--ink);padding:3px 9px;border-radius:999px}
.now.scene .chip{background:var(--cream)}
.now h2{font-size:23px;margin-top:6px}
.sub{font-size:13px;color:var(--dim);margin-top:3px}
.attach{margin-top:14px;border:1px dashed var(--edge2);border-radius:11px;padding:11px 13px}
.attach ul{margin:7px 0 0;padding-left:18px;font-family:var(--mono);font-size:12.5px;
           color:var(--cream2)}
.attach li{margin-bottom:3px}
pre.msg{font-family:var(--mono);font-size:13px;line-height:1.62;background:var(--ink);
        border:1px solid var(--edge);border-radius:11px;padding:14px;margin:14px 0 0;
        white-space:pre-wrap;word-break:break-word;color:var(--cream2);
        max-height:46vh;overflow:auto}
.acts{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
button{font-family:var(--disp);font-weight:800;font-size:15px;border:0;border-radius:12px;
       padding:14px 18px;cursor:pointer;min-height:48px}
.primary{background:var(--amber);color:var(--ink);flex:1;min-width:150px}
.primary:hover{background:var(--amberL)}
.ghost{background:var(--panel2);color:var(--cream);border:1px solid var(--edge2)}
.ghost:hover{border-color:var(--dim)}
button:focus-visible,a:focus-visible,.step:focus-visible{outline:2px solid var(--amberL);
       outline-offset:2px}
.hint{font-size:12.5px;color:var(--dimmer);margin-top:10px}

/* ---- the run ---- */
.secrow{display:flex;align-items:baseline;gap:10px;margin:26px 0 8px}
.secrow .lbl{flex:none}
.secrow .rule{flex:1;height:1px;background:var(--edge)}
.secrow .n{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
.step{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
      background:transparent;border:0;border-bottom:1px solid var(--edge);
      padding:9px 6px;border-radius:0;min-height:44px;font-family:var(--body);
      font-weight:400;font-size:14px;color:var(--cream);cursor:pointer}
.step:hover{background:var(--panel)}
.step.cur{background:var(--panel);box-shadow:inset 2px 0 0 var(--amber)}
.step .tick{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--edge2);
            flex:none;display:grid;place-items:center}
.step.done .tick{background:var(--green);border-color:var(--green)}
.step.done .tick svg{display:block}
.step .tick svg{display:none}
.step .id{font-family:var(--mono);font-size:11.5px;color:var(--dim);width:58px;flex:none}
.step .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.done .nm{color:var(--dimmer);text-decoration:line-through}
.step.scene .id{color:var(--amber)}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--edge);
       font-size:12.5px;color:var(--dimmer)}
footer a{color:var(--amber)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="bar">
    <div class="row">
      <h1>Café Life &mdash; art run</h1>
      <div class="count"><span id="c-done">0</span> / <span id="c-all">99</span> sent</div>
    </div>
    <div class="track"><i id="track"></i></div>
  </div>

  <div id="now"></div>

  <div id="list"></div>

  <footer>
    Ninety-five images across four set-ups. Send each set-up once, then one line per message.
    Progress is remembered in this browser only.
    <button class="ghost" id="reset" style="font-size:12px;padding:7px 12px;min-height:0;
            margin-left:8px">Start over</button>
  </footer>
</div>

<script>
(function(){
  var STEPS = JSON.parse(document.getElementById('steps').textContent);
  var KEY = 'cafelife_artrun_v1';
  var done = {}, cur = 0;

  try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { done = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }

  function firstUndone(){
    for (var i = 0; i < STEPS.length; i++) if (!done[STEPS[i].id]) return i;
    return STEPS.length - 1;
  }
  cur = firstUndone();

  var TICK = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#171310"' +
             ' stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">' +
             '<path d="M20 6 9 17l-5-5"/></svg>';

  function esc(s){ return s.replace(/[&<>]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

  function drawNow(){
    var s = STEPS[cur], n = document.getElementById('now');
    var isScene = s.kind === 'scene';
    var att = '';
    if (s.attach && s.attach.length) {
      att = '<div class="attach"><div class="lbl">Attach ' +
            (s.attach.length === 1 ? 'this file' : 'these ' + s.attach.length + ' files') +
            ' to the message</div><ul>' +
            s.attach.map(function(f){ return '<li>' + esc(f) + '</li>'; }).join('') +
            '</ul></div>';
    }
    var pos = (cur + 1) + ' of ' + STEPS.length;
    n.className = 'now' + (isScene ? ' scene' : '');
    n.innerHTML =
      '<div class="now-head"><span class="chip">' + esc(s.id) + '</span>' +
      '<span class="lbl">' + (isScene ? 'send this first' : 'message ' + pos) + '</span></div>' +
      '<h2>' + esc(s.name) + '</h2>' +
      '<div class="sub">' + (isScene
        ? 'Send this once, wait for &ldquo;ready&rdquo;, then work down the list.'
        : esc(s.sec) + ' &middot; paste this as its own message') + '</div>' +
      att +
      '<pre class="msg" id="msg">' + esc(s.text) + '</pre>' +
      '<div class="acts">' +
      '<button class="primary" id="copy">Copy this message</button>' +
      '<button class="ghost" id="next">' + (done[s.id] ? 'Next' : 'Sent — next') + '</button>' +
      (cur > 0 ? '<button class="ghost" id="prev">Back</button>' : '') +
      '</div>' +
      (isScene ? '<div class="hint">Keep the same chat open for every message in this set-up. ' +
       'If the style starts drifting, re-attach the reference images and say &ldquo;match these&rdquo;.</div>' : '');

    document.getElementById('copy').onclick = function(){
      var btn = this, txt = STEPS[cur].text;
      var ok = function(){ btn.textContent = 'Copied'; setTimeout(function(){
        btn.textContent = 'Copy this message'; }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(ok, fallback);
      } else fallback();
      function fallback(){
        var ta = document.createElement('textarea');
        ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); ok(); }
        catch (e) { btn.textContent = 'Select the text above'; }
        document.body.removeChild(ta);
      }
    };
    document.getElementById('next').onclick = function(){
      done[STEPS[cur].id] = 1; save();
      if (cur < STEPS.length - 1) cur++;
      drawAll();
      document.getElementById('now').scrollIntoView({ block: 'start',
        behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' });
    };
    var pv = document.getElementById('prev');
    if (pv) pv.onclick = function(){ if (cur > 0) cur--; drawAll(); };
  }

  function drawList(){
    var html = '', sec = null, counts = {};
    STEPS.forEach(function(s){ counts[s.sec] = (counts[s.sec] || 0) + 1; });
    STEPS.forEach(function(s, i){
      if (s.sec !== sec) {
        sec = s.sec;
        var d = STEPS.filter(function(x){ return x.sec === sec && done[x.id]; }).length;
        html += '<div class="secrow"><div class="lbl">' + esc(sec) + '</div>' +
                '<div class="rule"></div><div class="n">' + d + '/' + counts[sec] + '</div></div>';
      }
      html += '<button class="step' + (done[s.id] ? ' done' : '') + (i === cur ? ' cur' : '') +
              (s.kind === 'scene' ? ' scene' : '') + '" data-i="' + i + '">' +
              '<span class="tick">' + TICK + '</span>' +
              '<span class="id">' + esc(s.id) + '</span>' +
              '<span class="nm">' + esc(s.name) + '</span></button>';
    });
    var L = document.getElementById('list');
    L.innerHTML = html;
    L.querySelectorAll('.step').forEach(function(b){
      b.onclick = function(){ cur = +b.dataset.i; drawAll();
        document.getElementById('now').scrollIntoView({ block: 'start',
          behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' }); };
    });
  }

  function drawAll(){
    var d = STEPS.filter(function(s){ return done[s.id]; }).length;
    document.getElementById('c-done').textContent = d;
    document.getElementById('c-all').textContent = STEPS.length;
    document.getElementById('track').style.width = (d / STEPS.length * 100) + '%';
    drawNow(); drawList();
  }

  document.getElementById('reset').onclick = function(){
    done = {}; save(); cur = 0; drawAll();
  };

  drawAll();
})();
</script>
